<style>

.wrap{max-width:1230px;margin:auto;padding:0 28px}.mast{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cdd8c9}.brand{display:flex;align-items:center;gap:12px;letter-spacing:2px;font-size:18px}.mark{width:34px;height:34px;border-radius:10px;background:var(--green);color:#e9f2dc;display:grid;place-items:center;font:24px Georgia,serif}.demo-label{font-size:12px;color:var(--muted);letter-spacing:0}.intro{display:flex;align-items:end;justify-content:space-between;gap:32px;padding:34px 0 24px}h1{font:34px/1.4 Georgia,"SimSun",serif;letter-spacing:1px}.lead{color:var(--muted);margin-top:9px;max-width:600px}.states{display:flex;flex-wrap:wrap;gap:5px;align-items:center}.states span{width:100%;font-size:11px;color:var(--muted);margin-bottom:3px}.state-btn{border:1px solid #cbd6c5;min-height:36px;padding:5px 11px;border-radius:8px;font-size:12px}.state-btn[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}
.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:0 0 25px}.principle{display:flex;gap:12px;font-size:12px;color:var(--muted)}.principle b{font:italic 19px Georgia,serif;color:#718665}.principle strong{color:var(--ink);display:block;font-size:13px;margin-bottom:3px}.phones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;align-items:start}.label{display:flex;justify-content:space-between;margin:0 8px 10px;color:var(--muted);font-size:11px}.device{height:752px;width:100%;max-width:374px;margin:auto;border:7px solid #fcfdf9;outline:1px solid #bfcdba;background:var(--paper);border-radius:32px;box-shadow:0 12px 32px #314b3610;overflow:hidden;display:flex;flex-direction:column;position:relative}.os{height:29px;padding:5px 20px 0;display:flex;justify-content:space-between;font-size:10px;position:relative;flex:none}.os:after{content:"";width:6px;height:6px;border-radius:50%;background:#40523c;position:absolute;left:50%;top:10px}.os span:last-child{font-size:10px;letter-spacing:3px}.appbar{height:60px;display:flex;align-items:center;padding:0 8px 0 16px;gap:0;flex:none;border-bottom:1px solid #e5ebdf}.appbar .title{font-size:20px;white-space:nowrap;min-width:0;flex:1;font-weight:650;letter-spacing:.3px}.icon{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;flex:none}.icon:hover{background:var(--soft)}.menu-icon{margin-left:-9px;margin-right:2px}.icon svg{width:20px;height:20px}.utilities{display:flex;align-items:center;flex:none;gap:2px}.gear{color:var(--muted);margin-right:4px}.status{height:44px;min-width:72px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 7px;font-size:11px;white-space:nowrap;border-radius:11px}.status:hover{background:var(--soft)}.dot{width:6px;height:6px;border-radius:50%;background:#5d8146;flex:none}.status[data-state=offline]{color:var(--muted)}.status[data-state=offline] .dot{background:transparent;border:1px solid #85927d}.status[data-state=expired]{color:var(--red)}.status[data-state=expired] .dot{background:var(--red)}.status[data-state=connecting]{color:var(--amber)}.status[data-state=connecting] .dot{width:10px;height:10px;background:none;border:1.5px solid #d7ba8d;border-top-color:var(--amber);animation:spin 1s linear infinite}.scan{background:var(--soft);margin-left:2px}.scan:hover{background:var(--active)}
.content{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#c5d2bc transparent;padding:22px 17px 14px}.overline{font-size:11px;color:var(--muted);margin-bottom:9px}.content h2{font:27px/1.4 Georgia,"SimSun",serif;margin-bottom:10px}.muted{color:var(--muted);font-size:12px;line-height:1.85}.hero{background:var(--green);color:white;padding:22px;border-radius:20px;margin:22px 0}.hero .muted{color:#d7e3c9}.hero .word{font:36px/1.4 Georgia,serif;margin:9px 0 4px}.hero .cta{background:#e9f1d8;color:var(--green);margin-top:19px;width:100%}.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:11px;background:var(--green);color:white;font-size:13px}.cta.secondary{background:var(--soft);color:var(--green)}.section-title{font-size:15px;margin:23px 0 10px;font-weight:600}.rowlink{display:flex;align-items:center;gap:13px;width:100%;min-height:62px;text-align:left;padding:10px 2px;border-bottom:1px solid var(--line)}.rowlink>svg{color:#6e8560}.rowlink .copy{flex:1;min-width:0}.rowlink strong{display:block;font-size:13px}.rowlink small{display:block;color:var(--muted);font-size:11px}.rowlink .chevron{width:15px;color:var(--muted)}.note{font-size:11px;color:var(--muted);padding:15px 0;line-height:1.8}.search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:white;border-radius:11px;padding:0 12px;min-height:44px}.search svg{width:16px;color:var(--muted)}.search input{border:0;outline:0;background:none;width:100%;min-width:0;font-size:12px;padding:11px 0}.filters{display:flex;gap:8px;margin:14px 0 20px}.chip{border:1px solid var(--line);border-radius:16px;padding:5px 13px;font-size:11px;min-height:34px}.chip.active{background:var(--active);border-color:#d1dfc2}.vocab{padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}.vocab>div{flex:1;min-width:0}.vocab strong{font:23px Georgia,serif}.vocab p{font-size:12px;color:var(--muted);margin-top:4px}.vocab .icon{background:var(--soft);width:44px}.subtag{display:block;font-size:10px;color:#708061;margin-top:8px}.user-bubble{background:#e8f0dd;padding:12px 14px;border-radius:16px 16px 3px 16px;margin:14px 0 23px 24px;font-size:12px}.time{text-align:center;font-size:10px;color:#728067;margin-bottom:13px}.teacher{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:12px}.teacher .spark{width:25px;height:25px;background:var(--active);display:grid;place-items:center;border-radius:8px}.spark svg{width:15px}.chat-body{font-size:12px;line-height:1.9}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.compare>div{border-left:2px solid #d2dfbf;padding-left:10px}.compare strong{font:23px Georgia,serif}.compare p{font-size:11px;margin:4px 0}.saved{display:flex;gap:9px;align-items:center;background:var(--soft);border:1px solid #d8e3cb;border-radius:12px;padding:12px 10px;margin:17px 0 10px;font-size:12px}.saved small{display:block;color:var(--muted);font-size:10px}.saved svg{width:17px}.quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.quick button{font-size:11px;border:1px solid var(--line);border-radius:17px;min-height:34px;padding:6px 9px}.quick svg{width:13px;height:13px;margin-right:4px}.composer{padding:10px 12px 7px;display:flex;gap:7px;border-top:1px solid var(--line)}.composer input{min-width:0;flex:1;border:1px solid var(--line);background:white;border-radius:12px;padding:10px;font-size:11px}.composer button{background:var(--green);color:white;border-radius:12px}.nav{height:68px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;border-top:1px solid var(--line);padding:4px 9px;flex:none;background:#fbfcf8}.nav button{height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;gap:3px;color:var(--muted);border-radius:18px}.nav button svg{width:20px;height:20px}.nav button[aria-current=page]{background:var(--active);color:var(--green)}.gesture{height:15px;flex:none;display:grid;place-items:center;background:#fbfcf8}.gesture:after{content:"";width:100px;height:3px;border-radius:3px;background:#73816b}.footer{display:flex;justify-content:space-between;gap:20px;padding:22px 0 30px;font-size:11px;color:var(--muted)}
dialog{width:min(400px,calc(100% - 24px));max-height:85dvh;overflow:auto;border:1px solid #d1ddc9;border-radius:24px 24px 16px 16px;background:var(--paper);color:var(--ink);padding:22px;margin:auto;inset:auto 0 max(20px,4vh);box-shadow:0 20px 80px #172e3033}dialog::backdrop{background:#162e2a5c;backdrop-filter:blur(2px)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.sheet-head h2{font-size:20px}.sheet-head .icon{margin:-10px -10px -10px 0}.sheet-status{display:flex;gap:13px;align-items:center;padding:18px;background:var(--soft);border-radius:14px;margin-bottom:14px}.sheet-status>svg{width:28px;height:28px}.sheet-status strong{display:block;font-size:15px}.sheet-status small{color:var(--muted);font-size:11px}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.sheet-actions svg{width:17px}.danger{color:var(--red)!important}.device-line{display:flex;justify-content:space-between;font-size:12px;padding:10px 0;border-bottom:1px solid var(--line)}.device-line span{color:var(--muted)}.viewfinder{height:210px;border:1px dashed #a6b995;background:#eaf0e2;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:14px 0;color:#67805c;flex-direction:column;gap:12px}.viewfinder svg{width:80px;height:80px;stroke-width:1}.snackbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 18px;background:var(--green);color:white;border-radius:10px;box-shadow:0 5px 30px #153f3220;max-width:calc(100% - 32px);font-size:12px;z-index:10;text-align:center}.setting-heading{font-size:11px;color:var(--muted);margin:25px 0 4px}.child .content{padding-top:10px}.settings-back{margin-left:-10px;margin-right:4px}.mock-quiz{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:16px}.mock-option{display:flex;border:1px solid var(--line);border-radius:10px;margin-top:9px;align-items:center;overflow:hidden}.mock-option>button:first-child{flex:1;text-align:left;align-self:stretch;padding:10px;font-size:12px}.mock-option .icon{border-left:1px solid var(--line);border-radius:0}.mock-option.correct{background:var(--active)}.quiz-result{font-size:12px;color:var(--green);margin-top:12px}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}@media(max-width:1050px){.phones{gap:16px}.wrap{padding:0 20px}.appbar{padding-left:12px}.content{padding-left:14px;padding-right:14px}.gear{margin-right:0}.appbar .title{font-size:18px}.status{min-width:64px;padding:0 3px}.icon{width:44px}.compare strong{font-size:20px}}@media(max-width:860px){.phones{grid-template-columns:1fr}.device{max-width:390px}.label{max-width:374px;margin:18px auto 10px}.intro{align-items:start;flex-direction:column;gap:20px}.principles{grid-template-columns:1fr;gap:13px}h1{font-size:29px}.footer{flex-direction:column;gap:4px}.mast{height:65px}.demo-label{font-size:10px}}@media(max-width:360px){.wrap{padding:0 10px}.device{border-width:4px;border-radius:25px}.appbar{padding-left:10px;padding-right:4px}.status{min-width:62px}.icon{width:44px}.appbar .title{font-size:18px}.utilities{gap:0}}
</style>
</head>
<body>
<div class="wrap">
<header class="mast"><div class="brand"><span class="mark">简</span><strong>青简</strong></div><span class="demo-label">布局建议 · 可交互 HTML · 演示数据</span></header>
<section class="intro"><div><h1>把连接留在同一处。</h1><p class="lead">状态与扫码始终在主页面右上角；点状态展开连接操作。<br>设置集中在学习首页，日常学习与对话不再被一排控制按钮打断。</p></div><div class="states" aria-label="切换演示连接状态"><span>试试状态变化 · 三页同步</span><button class="state-btn" data-state="connected" aria-pressed="true">已连接</button><button class="state-btn" data-state="offline" aria-pressed="false">未连接</button><button class="state-btn" data-state="connecting" aria-pressed="false">连接中</button><button class="state-btn" data-state="expired" aria-pressed="false">配对失效</button></div></section>
<section class="principles" aria-label="布局规则"><div class="principle"><b>01</b><div><strong>状态 + 扫码，三页固定同一位置</strong>和标题同行，列表滚动时也不移走。</div></div><div class="principle"><b>02</b><div><strong>重连与停止，点状态后再操作</strong>收进连接面板，按钮带图标和文字。</div></div><div class="principle"><b>03</b><div><strong>设置只留一个主入口</strong>学习页齿轮进入；子页保留返回与标题。</div></div></section>
<main class="phones" aria-label="三个主页面并排比较"></main>
<footer class="footer"><span>可以点击：状态、扫码、设置、底部导航、AI 对话菜单。</span><span>仅演示布局与交互；不会访问相机、连接电脑或修改 App。</span></footer>
</div>
<dialog id="panel" aria-labelledby="panel-title"></dialog>
<div class="snackbar" role="status" hidden></div>
<script>
(() => {
  const paths = {
    scan:'<path d="M4 9V5a1 1 0 0 1 1-1h4m6 0h4a1 1 0 0 1 1 1v4m0 6v4a1 1 0 0 1-1 1h-4m-6 0H5a1 1 0 0 1-1-1v-4M7 12h10"/>',
    gear:'<path d="m9 3-1 3-3 1-1 3 2 2-1 3 2 2 3-1 2 2 3-1 1-3 3-1 1-3-2-2 1-3-2-2-3 1-2-2Z"/><circle cx="11.5" cy="10.5" r="3"/>',
    menu:'<path d="M5 6h14M5 12h10M5 18h14"/>',back:'<path d="m14 5-7 7 7 7M7 12h13"/>',
    refresh:'<path d="M19 10a7 7 0 1 0-1 7M19 5v5h-5"/>',power:'<path d="M12 3v8M7 5a8 8 0 1 0 10 0"/>',
    close:'<path d="m6 6 12 12M6 18 18 6"/>',monitor:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',
    home:'<path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/>',book:'<path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1v15"/>',
    spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',
    arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',chevron:'<path d="m9 6 6 6-6 6"/>',
    speaker:'<path d="m11 5-6 5H2v4h3l6 5Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>',
    headphones:'<path d="M4 13v-2a8 8 0 0 1 16 0v2M4 12h3v8H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2Zm16 0h-3v8h3a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2Z"/>',
    search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',check:'<path d="m5 12 4 4L19 6"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',send:'<path d="m3 3 19 9-19 9 4-9Zm4 9h15"/>',
    sliders:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="var(--paper)"/><circle cx="15" cy="17" r="2" fill="var(--paper)"/>',
    shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/>'
  };
  const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name] || paths.arrow}</svg>`;
  const button = (name, action, label, cls = 'icon') => `<button class="${cls}" data-action="${action}" aria-label="${label}" title="${label}">${icon(name)}</button>`;
  const pageNames = {learn:'学习',words:'词库',ai:'AI 老师',settings:'设置',speech:'朗读设置',aiSettings:'AI 设置',preferences:'学习偏好',about:'数据与关于',updates:'应用更新'};
  const states = {connected:'已连接',offline:'未连接',connecting:'连接中',expired:'配对失效'};
  let state='connected', timer, toastTimer, owner=0;
  const pages=['learn','words','ai'].map(page => ({page, previous:'learn', filter:'全部', query:'', quiz:false, answered:false}));
  const panel=document.querySelector('#panel');
  function toast(text) { const box=document.querySelector('.snackbar'); box.textContent=text; box.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>box.hidden=true,3000); }
  const entry=(name,desc,ico,action)=>`<button class="rowlink" data-action="${action}">${icon(ico)}<span class="copy"><strong>${name}</strong><small>${desc}</small></span>${icon('chevron').replace('<svg ','<svg class="chevron" ')}</button>`;
  function header(p) {
    const child=!['learn','words','ai'].includes(p.page);
    return `<header class="appbar">${child?button('back','back','返回','icon settings-back'):p.page==='ai'?button('menu','conversations','展开学习对话','icon menu-icon'):''}<div class="title">${p.page==='learn'?'青简':pageNames[p.page]}</div>${child?'':`<div class="utilities">${p.page==='learn'?button('gear','settings','应用设置','icon gear'):''}<button class="status" data-action="connection" data-state="${state}" aria-label="电脑${states[state]}，打开连接面板" title="连接状态与操作"><i class="dot" aria-hidden="true"></i><span>${states[state]}</span></button>${button('scan','scan','扫码连接电脑','icon scan')}</div>`}</header>`;
  }
  function home(){return `<p class="overline">初学入门 · 每天 10 分钟</p><h2>今天，也学会一点。</h2><p class="muted">从你真正用过的词开始。</p><section class="hero"><p class="muted">继续你的学习</p><div class="word">control</div><p class="muted">控制；调节</p><button class="cta" data-action="practice">继续学习 ${icon('arrow')}</button></section><h3 class="section-title">按自己的节奏来</h3>${entry('复习一下，记得更牢','今天有 3 个词可以复习','clock','practice')}${entry('和 AI 老师聊聊','区分近义词，学会日常表达','spark','ai')}<p class="note">${state==='connected'?'电脑朗读的词会收录到词库。':'电脑未连接，已保存的词卡仍可学习。'}</p>`;}
  const vocabulary=[['control','控制；调节','待复习'],['manage','管理；处理','待学习'],['implement','实施；执行','待学习'],['realize','意识到；实现','待复习']];
  function words(p){return `<label class="search">${icon('search')}<input aria-label="搜索词汇" placeholder="搜索单词或中文" value="${p.query.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}"></label><div class="filters">${['全部','待学习','待复习'].map(f=>`<button class="chip ${p.filter===f?'active':''}" data-filter="${f}" aria-pressed="${p.filter===f}">${f}</button>`).join('')}</div><p class="overline">我的词汇 · ${vocabulary.length} 词</p><div class="word-list">${wordRows(p)}</div>`;}
  function wordRows(p){const list=vocabulary.filter(w=>(p.filter==='全部'||w[2]===p.filter)&&w.join(' ').toLowerCase().includes(p.query.toLowerCase()));return list.length?list.map(w=>`<article class="vocab"><div><strong>${w[0]}</strong><p>${w[1]}</p><span class="subtag">${w[2]} · 来自日常输入</span></div><button class="icon" data-speak="${w[0]}" aria-label="朗读 ${w[0]}">${icon('speaker')}</button></article>`).join(''):'<p class="note">没有找到这个词，试试其他关键词。</p>';}
  function ai(p){return `<div class="time">今天 · 示例对话</div><div class="user-bubble">帮我学会区分 control 和 manage。</div><div class="teacher"><span class="spark">${icon('spark')}</span><strong>青简老师</strong></div><div class="chat-body">先分清这两个日常场景：<div class="compare"><div><strong>control</strong><p>控制、调节</p><p>control the volume<br>调节音量</p></div><div><strong>manage</strong><p>管理、处理</p><p>manage a team<br>管理团队</p></div></div><div class="saved">${icon('check')}<div>已加入待学习<small>manage · 管理；处理 · 本次新增 1 词</small></div></div><p class="note">加入待学习不代表已掌握。</p></div>${p.quiz?`<section class="mock-quiz"><p class="overline">搭配练习 · control</p><p>哪个搭配表示“调节音量”？</p>${['control the volume','manage the volume'].map((s,i)=>`<div class="mock-option ${p.answered&&i===0?'correct':''}"><button data-answer="${i}" ${p.answered?'disabled':''}>${String.fromCharCode(65+i)} &nbsp; ${s}</button><button class="icon" data-speak="${s}" aria-label="朗读 ${s}">${icon('speaker')}</button></div>`).join('')}${p.answered?'<p class="quiz-result" role="status">示例答案：control the volume。<br>这里只演示反馈，不保存成绩。</p>':''}</section>`:`<div class="quick"><button data-action="practice">${icon('book')}练一题</button><button data-speak="control">${icon('speaker')}听发音</button></div>`}`;}
  function settings(){return `<p class="note">把不常修改的选项，放在这里。</p><h3 class="setting-heading">学习</h3>${entry('学习偏好','初学入门 · 每天 5 个新词','sliders','preferences')}${entry('AI 设置','模型接口、学习工具与连接测试','spark','aiSettings')}<h3 class="setting-heading">声音</h3>${entry('朗读设置','女声 1 · af_heart · 语速 1.0×','headphones','speech')}<h3 class="setting-heading">应用</h3>${entry('应用更新','0.2.16-dev · 构建 25','refresh','updates')}${entry('数据与关于','本机记录、版本与开源许可','shield','about')}<p class="note">连接操作统一从主页右上角的状态进入，设置里不再重复列“启动 / 停止”。</p>`;}
  function child(p){if(p.page==='settings')return settings();if(p.page==='speech')return `<h3 class="setting-heading">当前音色</h3>${entry('女声 1 · af_heart','使用内置离线音色','headphones','sample')}<h3 class="setting-heading">播放</h3>${entry('语速','1.0× · 标准速度','sliders','sample')}${entry('音量增强','180%','speaker','sample')}<p class="note">这里仅展示设置归属，选项为演示值。</p>`;return `<h3 class="section-title">${pageNames[p.page]}</h3><p class="muted">这是子页面的位置示意。左上角返回设置，上级入口不在这里重复显示。</p><p class="note">此原型聚焦连接与设置入口，没有实现此页业务。</p>`;}
  function render(i){const p=pages[i],childPage=!['learn','words','ai'].includes(p.page);const host=document.querySelector(`[data-phone="${i}"]`);host.classList.toggle('child',childPage);host.innerHTML=`<div class="os"><span>9:41</span><span>▴ ≋ ▰</span></div>${header(p)}<div class="content">${p.page==='learn'?home():p.page==='words'?words(p):p.page==='ai'?ai(p):child(p)}</div>${p.page==='ai'?`<form class="composer"><input aria-label="向 AI 老师提问" placeholder="想学什么，直接告诉我…"><button class="icon" aria-label="发送示例问题">${icon('send')}</button></form>`:''}${childPage?'':`<nav class="nav" aria-label="主导航">${['learn','words','ai'].map((name,n)=>`<button data-page="${name}" ${p.page===name?'aria-current="page"':''}>${icon(['home','book','spark'][n])}<span>${pageNames[name]}</span></button>`).join('')}</nav>`}<div class="gesture" aria-hidden="true"></div>`;}
  function renderAll(){pages.forEach((_,i)=>render(i));document.querySelectorAll('.state-btn').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===state));}
  function setState(next){clearTimeout(timer);state=next;renderAll();if(panel.open&&panel.dataset.mode==='connection')connection();}
  function show(mode){panel.dataset.mode=mode;if(!panel.open)panel.showModal();}
  function sheetHead(title){return `<div class="sheet-head"><h2 id="panel-title">${title}</h2>${button('close','close','关闭面板')}</div>`;}
  function connection(){const text={connected:['电脑已连接','正在接收朗读 · 演示状态'],offline:['电脑未连接','本机学习和离线朗读仍可使用'],connecting:['正在连接电脑','正在尝试恢复已保存的配对'],expired:['配对地址已失效','临时连接已结束，需要重新扫码']}[state];panel.innerHTML=sheetHead('电脑连接')+`<div class="sheet-status">${icon('monitor')}<div><strong>${text[0]}</strong><small>${text[1]}</small></div></div><div class="device-line"><span>配对电脑</span><strong>我的 Windows 电脑</strong></div><div class="device-line"><span>最近接收</span><strong>control · 09:38</strong></div><div class="device-line"><span>最近朗读</span><strong>已完成</strong></div><div class="sheet-actions">${state==='expired'?`<button class="cta" data-action="scan">${icon('scan')}重新扫码</button>`:`<button class="cta" data-action="reconnect" ${state==='connecting'?'disabled':''}>${icon('refresh')}${state==='connecting'?'连接中…':'重新连接'}</button>`}<button class="cta secondary ${state==='connected'?'danger':''}" data-action="${state==='connected'||state==='connecting'?'stop':'close'}">${icon(state==='connected'||state==='connecting'?'power':'close')}${state==='connected'||state==='connecting'?'停止连接':'暂时关闭'}</button></div><p class="note">仅演示连接状态，不会操作正在运行的电脑连接工具。</p>`;show('connection');}
  function scan(){panel.innerHTML=sheetHead('扫码连接电脑')+`<p class="muted">对准电脑“手机朗读”页面的配对二维码。</p><div class="viewfinder">${icon('scan')}<span>相机取景区域 · 布局演示</span></div><button class="cta" style="width:100%" data-action="scan-success">模拟扫码成功 ${icon('arrow')}</button><p class="note">此页面不会打开相机，也不生成真实配对地址。实际 App 扫码成功后应自动连接。</p>`;show('scan');}
  function reconnect(){setState('connecting');timer=setTimeout(()=>{setState('connected');toast('演示：连接已恢复');},1400);}
  function action(a,i){owner=i;const p=pages[i];if(a==='connection')return connection();if(a==='scan')return scan();if(a==='close')return panel.close();if(a==='reconnect')return reconnect();if(a==='stop'){setState('offline');return toast('演示：已停止连接，本机学习仍可使用');}if(a==='scan-success'){panel.close();reconnect();return;}if(a==='conversations'){panel.innerHTML=sheetHead('学习对话')+entry('control / manage','当前对话 · 今天','spark','close')+entry('日常英语','昨天','book','close')+'<p class="note">这里管理对话。全局设置仍从学习首页进入。</p>';return show('conversations');}if(a==='back'){p.page=p.page==='settings'?p.previous:'settings';return render(i);}if(a==='settings'){p.previous=p.page;p.page='settings';return render(i);}if(['speech','aiSettings','preferences','about','updates'].includes(a)){p.page=a;return render(i);}if(a==='ai'){p.page='ai';return render(i);}if(a==='practice'){p.page='ai';p.quiz=true;render(i);document.querySelector(`[data-phone="${i}"] .mock-quiz`).scrollIntoView({block:'nearest'});return;}toast('位置与交互演示，暂不修改实际设置');}
  document.querySelector('.phones').innerHTML=pages.map((p,i)=>`<section><div class="label"><span>${pageNames[p.page]}</span><span>${i===0?'设置仅在此处':'连接位置与首页一致'}</span></div><article class="device" data-phone="${i}" aria-label="${pageNames[p.page]}页面预览"></article></section>`).join('');
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const phone=b.closest('[data-phone]');const i=phone?Number(phone.dataset.phone):owner;if(b.classList.contains('state-btn'))return setState(b.dataset.state);if(b.dataset.page){pages[i].page=b.dataset.page;return render(i);}if(b.dataset.filter){pages[i].filter=b.dataset.filter;return render(i);}if(b.dataset.speak){toast(`演示：朗读 ${b.dataset.speak}（未播放音频）`);return;}if(b.dataset.answer){pages[i].answered=true;return render(i);}if(b.dataset.action)action(b.dataset.action,i);});
  document.addEventListener('input',e=>{if(e.target.matches('.search input')){const i=Number(e.target.closest('[data-phone]').dataset.phone);pages[i].query=e.target.value;document.querySelector(`[data-phone="${i}"] .word-list`).innerHTML=wordRows(pages[i]);}});
  document.addEventListener('submit',e=>{if(e.target.matches('.composer')){e.preventDefault();toast('这是界面演示，不会发送 AI 请求。');}});
  panel.addEventListener('click',e=>{if(e.target===panel){const r=panel.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)panel.close();}});
  renderAll();
})();
</script>
</body>
</html>
