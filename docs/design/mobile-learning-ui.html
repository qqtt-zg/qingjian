.row-copy strong,.topic-card strong{font-size:13px}.row-copy small,.topic-card small,.example-cn,.teacher-intro p,.settings-hero small{font-size:11px}.hero-meaning,.small-text{font-size:12px}.word-actions .primary{font-size:12px}.content{scrollbar-width:none}.content::-webkit-scrollbar{display:none}.example-label{font-size:11px}.bottom button{font-size:11px}

<body>
<div class="wrap">
<header class="mast"><div class="brand"><span class="brandmark">简</span><span class="brand-name">青简</span><span class="brand-note">随身英语学习</span></div><div class="mast-right"><span>UI CONCEPT · 01</span><button id="reset" aria-label="重置全部演示">重置演示 ↺</button></div></header>
<div class="intro"><div><h1>从日常，到学会。</h1><p>每天一个学习入口，让词汇、朗读和 AI 辅导自然接在一起。</p></div><div class="mode" aria-label="预览模式"><button id="overview" aria-pressed="true">并排总览</button><button id="immersive" aria-pressed="false">单屏体验</button></div></div>
<div class="jump" aria-label="快速预览页面"><button data-jump="home">学习主页</button><button data-jump="word">词卡与练习</button><button data-jump="ai">AI 老师</button><button data-jump="words">我的词库</button><button data-jump="settings">设置</button><span class="note">所有页面均可点击 · 示例数据 · 无真实 API 或录音调用</span></div>
<main class="preview" id="preview" aria-label="青简 App 交互原型"></main>
<footer class="footer"><span>设计方向：学习主线清楚，解释围绕当前词，低频配置集中。</span><span>HTML 原型 · 独立演示数据 · 未修改安卓 App</span></footer>
</div>
<script>
const paths={home:'M3 10 12 3l9 7M5 9v12h5v-6h4v6h5V9',book:'M12 6c-3-2-6-2-9-1v15c3-1 6-1 9 1m0-15c3-2 6-2 9-1v15c-3-1-6-1-9 1V6',spark:'m12 3 2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2ZM20 3v4m-2-2h4',gear:'M10 3h4l.7 3 2 .9 2.7-.8 2 3.5-2 2.4v2l2 2.4-2 3.5-2.7-.8-2 .9-.7 3h-4l-.7-3-2-.9-2.7.8-2-3.5 2-2.4v-2l-2-2.4 2-3.5 2.7.8 2-.9Z M15 13a3 3 0 1 1-6 0 3 3 0 0 1 6 0',speaker:'m11 4-6 5H2v6h3l6 5V4m4 4c3 2 3 6 0 8m3-11c5 4 5 10 0 14',arrow:'M5 12h14m-5-5 5 5-5 5',back:'m15 5-7 7 7 7',chevron:'m9 5 7 7-7 7',repeat:'M4 8h13l-4-4m7 12H7l4 4M17 8l3 3m-13 5-3-3',mic:'M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0V5m-3 6v1a6 6 0 0 0 12 0v-1m-6 7v4m-3 0h6',search:'M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14m5-2 6 6',plus:'M12 5v14M5 12h14',check:'m5 12 4 4L20 5',close:'m6 6 12 12M6 18 18 6',send:'m3 3 18 9-18 9 4-9-4-9m4 9h14',monitor:'M3 4h18v12H3V4m9 12v5m-5 0h10',wifi:'M3 8c5-5 13-5 18 0M6 12c4-3 8-3 12 0m-9 4c2-1 4-1 6 0m-3 4h.01',battery:'M3 7h17v10H3V7m19 3v4M6 10h11v4H6Z',signal:'M4 20v-3m5 3v-7m5 7V9m5 11V4',headphones:'M4 14v-3a8 8 0 0 1 16 0v3M4 12h4v9H4v-9m12 0h4v9h-4v-9',clock:'M12 8v5l3 2m-3 7a10 10 0 1 0 0-20 10 10 0 0 0 0 20',download:'M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5',sliders:'M4 5h16M4 12h16M4 19h16M8 2v6m8 1v6m-7 1v6',history:'M3 11a9 9 0 1 1 2 7M3 4v7h7m2-4v6l4 2',bookmark:'M6 3h12v19l-6-4-6 4V3',shield:'m12 2 9 4v7c-1 5-5 8-9 10-4-2-8-5-9-10V6l9-4m-4 10 3 3 5-6'};
const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.spark}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=[{id:'control',en:'control',sound:'/kənˈtrəʊl/',cn:'控制；调节',pos:'v.',example:'I can <mark>control</mark> the volume.',translation:'我可以调节音量。',phrase:'control the volume · 调节音量',why:'调节音量时，control 表示让音量按你的意愿变化。',source:'青简收录',status:'学习中'}, {id:'manage',en:'manage',sound:'/ˈmænɪdʒ/',cn:'管理；设法做到',pos:'v.',example:'I <mark>manage</mark> a small team.',translation:'我管理一个小团队。',phrase:'manage a team · 管理团队',why:'这里的 manage 强调组织和处理团队的日常事务。',source:'AI 推荐',status:'待学习'}, {id:'volume',en:'volume',sound:'/ˈvɒljuːm/',cn:'音量',pos:'n.',example:'Turn down the <mark>volume</mark>, please.',translation:'请把音量调小。',phrase:'turn down the volume · 调小音量',why:'在声音的语境中，volume 指音量。先掌握这个常用意思。',source:'基础词汇',status:'待复习'}, {id:'need',en:'need',sound:'/niːd/',cn:'需要',pos:'v.',example:'I <mark>need</mark> some help.',translation:'我需要一些帮助。',phrase:'need some help · 需要一些帮助',why:'need 表示需要，后面可以直接接需要的东西。',source:'青简收录',status:'待复习'}, {id:'improve',en:'improve',sound:'/ɪmˈpruːv/',cn:'改善；提高',pos:'v.',example:'I want to <mark>improve</mark> my English.',translation:'我想提高我的英语水平。',phrase:'improve my English · 提高我的英语水平',why:'improve 表示让某件事变得更好，这里指提高英语水平。',source:'青简收录',status:'待学习'}];
const shared={completed:new Set(),added:new Set(),rate:100,voice:'女声 · af_heart',connected:true,playing:false,prefs:{level:'基础较弱 · 从常用词开始',purpose:'日常生活与工作',newWords:'5 个 · 轻量积累',time:'10 分钟'}};
const status=()=>`<div class="status"><span>9:41</span><span class="status-icons">${icon('signal')}${icon('wifi')}${icon('battery')}</span></div>`;
const screens={home:'今日学习',word:'学习一个词',ai:'AI 老师',words:'我的词库',settings:'设置',speech:'朗读设置',preferences:'学习偏好',api:'AI 配置',connection:'电脑连接',quiz:'随堂练习',review:'到期复习',done:'本词完成',history:'学习记录',update:'应用更新'};
const appIcons={home:'home',words:'book',ai:'spark'};
const views=[];
class App{
 constructor(index,route){this.index=index;this.route=route;this.wordId='control';this.backRoute='home';this.stack=[];this.filter='全部';this.query='';this.translation=true;this.quizAnswer=null;this.reviewShown=false;this.chat=[];this.busy=false;this.requestId=0;this.title=['01 / 学习主页','02 / 一词一练','03 / AI 辅导'][index];this.element=document.createElement('section');this.element.className='column';this.element.setAttribute('aria-label',this.title);this.element.innerHTML=`<div class="caption"><span>${this.title}</span><span>INTERACTIVE PREVIEW</span></div><div class="device"><div class="screen"></div></div>`;this.screen=this.element.querySelector('.screen');document.querySelector('#preview').append(this.element);this.element.addEventListener('click',e=>this.click(e));this.element.addEventListener('input',e=>this.input(e));this.render();}
 word(){return words.find(w=>w.id===this.wordId)||words[0];}
 go(route){this.requestId++;this.busy=false;if(this.route!==route){this.backRoute=this.route;this.stack.push(this.route);}this.route=route;this.render();}
 header(){const sub=!['home','words','ai'].includes(this.route);return `<header class="app-head">${sub?`<div class="head-back"><button class="icon-btn" data-action="back" aria-label="返回">${icon('back')}</button><h3>${screens[this.route]}</h3></div>`:`<div class="app-name">${this.route==='home'?'青简':screens[this.route]}${this.route==='home'?'<small>把日常用过的词，慢慢学会。</small>':''}</div>`}<div class="head-actions">${this.route==='ai'?`<button class="icon-btn" data-action="history" aria-label="查看对话记录">${icon('history')}</button>`:''}<button class="icon-btn" data-action="settings" aria-label="打开设置">${this.route==='home'?'<span class="avatar">简</span>':icon('gear')}</button></div></header>`;}
 nav(){const active=['words'].includes(this.route)?'words':['ai','history'].includes(this.route)?'ai':'home';return `<nav class="bottom" aria-label="应用导航">${[['home','学习'],['words','词库'],['ai','AI 老师']].map(([r,t])=>`<button data-action="${r}" aria-label="${t}" class="${r===active?'active':''}" ${r===active?'aria-current="page"':''}><span>${icon(appIcons[r])}</span>${t}</button>`).join('')}</nav>`;}
 render(){this.screen.innerHTML=status()+this.header()+`<div class="content fade">${this.page()}</div>`+(this.route==='ai'?this.composer():'')+this.nav();if(this.route==='preferences'){const values=Object.values(shared.prefs);this.screen.querySelectorAll('.test-form select').forEach((x,i)=>x.value=values[i]);}this.screen.classList.toggle('no-nav',['word','quiz','review','done','speech','api','preferences','connection','update'].includes(this.route));}
 page(){switch(this.route){case 'home':return this.home();case 'word':return this.wordPage();case 'ai':return this.ai();case 'words':return this.wordList();case 'settings':return this.settings();case 'quiz':return this.quiz();case 'review':return this.review();case 'done':return this.done();case 'speech':return this.speech();case 'api':return this.api();case 'preferences':return this.preferences();case 'connection':return this.connection();case 'history':return this.history();case 'update':return '<div class="settings-hero">'+icon('download')+'<div><strong>青简 · 随身学习</strong><small>版本与更新信息</small></div></div><p class="small-text">正式应用将在这里检查更新、展示下载进度和安装状态。</p><div class="test-state">这是 UI 原型，不检查或安装真实更新。</div>';default:return '';}}
 home(){const n=2+shared.completed.size;return `<section class="welcome"><div class="eyebrow">基础积累 · 每天 10 分钟</div><h2>今天，也学会一点。</h2><p>从你真正用过的词开始，不用急着学很多。</p></section><section class="hero"><div class="hero-top"><span class="label-light"><span class="dot"></span>继续今天的学习</span><span class="count">0${n} / 05</span></div><div class="hero-info"><div><div class="hero-word">control</div><div class="hero-meaning">控制；调节</div></div><button class="icon-btn hero-speaker" data-action="speak" aria-label="朗读 control">${icon('speaker')}</button></div><div class="progress-track"><span style="width:${Math.min(100,n*20)}%"></span></div><button class="primary" data-action="word">继续学习 ${icon('arrow')}</button></section><button class="row-action" data-action="review"><span class="tile-icon warm">${icon('repeat')}</span><span class="row-copy"><strong>复习一下，记得更牢</strong><small>3 个词到了复习时间 · 约 2 分钟</small></span>${icon('chevron','chevron')}</button><div class="hairline"></div><div class="daily-heading"><strong>今天遇到的词</strong><button class="small-link" data-action="words">查看全部 ${icon('chevron')}</button></div><div class="recent-box"><div class="recent-row"><span>control <em>控制</em></span><em>来自电脑</em></div><div class="recent-row"><span>improve <em>提高</em></span><em>来自电脑</em></div></div><div class="connection"><span><i class="dot" style="background:${shared.connected?'':'#c8ab84'}"></i>${shared.connected?'电脑已连接 · 朗读接收中':'电脑未连接 · 可继续本机学习'}</span><button data-action="connection">管理连接</button></div>`;}
 wordPage(){const w=this.word();return `<div class="stepper" aria-label="今日新词第 2 个，共 5 个"><span class="filled"></span><span class="filled"></span><span></span><span></span><span></span></div><div class="word-top"><span class="eyebrow">${esc(w.source)} · ${esc(w.status)}</span><button class="icon-btn" data-action="bookmark" aria-label="收藏当前词">${icon('bookmark')}</button></div><h2 class="word-title">${w.en}</h2><div class="phonetic">${w.sound}<button data-action="speak" aria-label="朗读当前词">${icon('speaker')}</button></div><div class="definition"><span class="pos">${w.pos}</span>${w.cn}</div><div class="example"><div class="example-label"><span>在一句话里学会</span><button class="icon-btn" data-action="speak-sentence" aria-label="朗读例句">${icon('speaker')}</button></div><p class="example-en">${w.example}</p>${this.translation?`<p class="example-cn">${w.translation}</p>`:''}<button class="inline-button" data-action="translate">${this.translation?'收起中文':'显示中文意思'}</button></div><details class="fold"><summary>记一个常用搭配 ${icon('chevron')}</summary><p>${w.phrase}</p></details><details class="fold"><summary>为什么这样用？ ${icon('chevron')}</summary><p>${w.why}</p></details><button class="ai-inline" data-action="ask-word">${icon('spark')}想问得更明白？让 AI 帮你解释 ${icon('chevron','chevron')}</button><div class="word-actions"><button class="secondary" data-action="oral">${icon('mic')}跟读</button><button class="primary" data-action="quiz">练一下，看看记住没 ${icon('arrow')}</button></div><p class="subnote">解释、朗读和练习，都围绕当前这个词。</p>`;}
 ai(){if(this.chat.length)return `<div class="chat-headline"><span>当前学习 · ${this.word().en}</span><button data-action="new-chat">新话题 ＋</button></div>${this.chat.map(m=>`<div class="chat-line ${m.role}">${m.role==='assistant'?`<div class="chat-label">${icon('spark')}青简老师</div>`:''}${m.html||esc(m.text)}</div>`).join('')}${this.busy?'<div class="chat-line assistant" role="status"><div class="typing"><span></span><span></span><span></span></div><span class="small-text">正在准备讲解…</span><button class="small-link" data-action="cancel-ai">取消</button></div>':''}<div class="chip-row"><button class="chip" data-action="suggest" data-prompt="能给我一个更简单的例句吗？">再简单一点</button><button class="chip" data-action="recommend">推荐新词</button><button class="chip" data-action="word">回到词卡</button></div>`;return `<section class="teacher-intro"><div class="teacher-symbol">${icon('spark')}</div><h2>有不懂的，<br>我们慢慢讲。</h2><p>从一个词、一句话开始。<br>我会用中文解释，每次只练一点。</p></section><button class="topic-card" data-action="recommend"><span class="tile-icon">${icon('book')}</span><span><strong>今天学哪几个词？</strong><small>按我的基础，推荐少量常用词</small></span>${icon('chevron','chevron')}</button><button class="topic-card" data-action="compare"><span class="tile-icon">${icon('spark')}</span><span><strong>两个词，该用哪一个？</strong><small>放进具体句子，更容易弄明白</small></span>${icon('chevron','chevron')}</button><button class="topic-card" data-action="express"><span class="tile-icon">${icon('mic')}</span><span><strong>这句话，英语怎么说？</strong><small>从你的中文表达开始练习</small></span>${icon('chevron','chevron')}</button><div class="section-label">接着刚才的学习</div><button class="context-pill" data-action="ask-word">${icon('bookmark')}control · 控制；调节 ${icon('arrow')}</button>`;}
 composer(){return `<div class="chat-composer"><form class="compose-box"><textarea rows="1" aria-label="向 AI 老师提问" placeholder="哪里不明白，直接问我…" ${this.busy?'disabled':''}></textarea><button type="submit" class="send" data-action="send" aria-label="发送问题" ${this.busy?'disabled':''}>${icon('send')}</button></form><div class="composer-note">演示回答 · 正式 AI 内容需结合语境核实</div></div>`;}
 wordList(){return `<div class="list-head"><span>你遇到的词，值得慢慢学会</span><button class="icon-btn" data-action="add-word" aria-label="添加词汇">${icon('plus')}</button></div><label class="search">${icon('search')}<input aria-label="搜索词汇" placeholder="搜索单词或中文意思" value="${esc(this.query)}"></label><div class="filters">${['全部','待学习','学习中','待复习'].map(f=>`<button class="${this.filter===f?'selected':''}" data-action="filter" data-filter="${f}">${f}</button>`).join('')}</div><div class="word-results">${this.wordRows()}</div><div class="offline-note">${icon('shield')}已保存的词汇与讲解，离线也能看。</div>`;}
 wordRows(){let data=words.filter(w=>(this.filter==='全部'||w.status===this.filter)&&(w.en+' '+w.cn).toLowerCase().includes(this.query.toLowerCase()));return data.length?data.map(w=>`<button class="vocab-row" data-action="open-word" data-word="${w.id}"><span><span class="vocab-word">${w.en}</span><span class="vocab-cn">${w.cn}</span></span><span class="vocab-badge">${w.status}</span>${icon('chevron','chevron')}</button>`).join(''):'<p class="empty">没有找到这个词，试试其他关键词。</p>';}
 settings(){const row=(i,t,v,a)=>`<button class="setting-row" data-action="${a}">${icon(i)}<span class="row-copy"><strong>${t}</strong></span><span class="setting-value">${v}</span>${icon('chevron','chevron')}</button>`;return `<div class="settings-hero"><span class="avatar">简</span><div><strong>按自己的节奏，慢慢来</strong><small>基础积累 · 每日 10 分钟</small></div></div><div class="settings-label">学习</div><div class="settings-group">${row('sliders','学习偏好','每天 5 个新词','preferences')}${row('spark','AI 服务','配置与测试','api')}</div><div class="settings-label">朗读与连接</div><div class="settings-group">${row('monitor','电脑连接',shared.connected?'已连接':'未连接','connection')}${row('headphones','朗读设置',shared.voice,'speech')}</div><div class="settings-label">应用</div><div class="settings-group">${row('history','学习记录','记录与统计','history')}${row('download','应用更新','版本与下载','update')}${row('shield','数据与隐私','本机学习资料','privacy')}</div><p class="subnote">连接负责接收朗读，离开电脑也能学习。</p>`;}
 speech(){return `<div class="settings-label">声音</div><div class="test-form"><label>朗读音色</label><select aria-label="朗读音色"><option ${shared.voice==='女声 · af_heart'?'selected':''}>女声 · af_heart</option><option ${shared.voice==='女声 · 默认'?'selected':''}>女声 · 默认</option><option ${shared.voice==='男声 · 默认'?'selected':''}>男声 · 默认</option></select></div><div class="value-row"><span>语速</span><strong class="rate-label">${(shared.rate/100).toFixed(2)} ×</strong></div><input class="range" type="range" min="50" max="200" step="5" value="${shared.rate}" aria-label="朗读语速"><p class="small-text">先从自然语速开始，听不清时可以放慢一点。</p><button class="primary" data-action="speak" style="margin-top:25px">${icon('speaker')}试听声音</button><div class="settings-label">播放</div><div class="settings-group"><button class="setting-row" data-action="ducking"><span class="row-copy"><strong>朗读时降低其他声音</strong><small>跟随系统音频焦点</small></span><span class="setting-value">已开启</span></button><button class="setting-row" data-action="background"><span class="row-copy"><strong>后台运行</strong><small>查看连接状态与电池设置</small></span>${icon('chevron','chevron')}</button></div><p class="subnote">演示设置仅在本页预览期间生效。</p>`;}
 api(){return `<p class="small-text">配置自己的文字 AI 服务。学习时直接从手机发起请求。</p><div class="test-form"><label for="endpoint-${this.index}">API 地址</label><input id="endpoint-${this.index}" value="https://api.example.com/v1" aria-label="API 地址"><label for="model-${this.index}">模型名称</label><input id="model-${this.index}" placeholder="填写服务商提供的模型 ID" aria-label="模型名称"><label for="key-${this.index}">API Key</label><input id="key-${this.index}" placeholder="原型中请勿填写真实密钥" type="password" autocomplete="off" aria-label="API Key"></div><button class="primary" style="margin-top:22px" data-action="test-api">测试连接</button><div class="api-result" role="status"></div><p class="subnote">仅演示测试状态，不发送网络请求或保存密钥。</p>`;}
 preferences(){return `<p class="small-text">学习方向先简单一点，之后随时可以调整。</p><div class="test-form"><label>当前基础</label><select aria-label="当前英语基础"><option>基础较弱 · 从常用词开始</option><option>能读简单句 · 想增加表达</option></select><label>主要用途</label><select aria-label="学习用途"><option>日常生活与工作</option><option>工作中的英语表达</option><option>日常交流</option></select><label>每天新词</label><select aria-label="每天新词数量"><option>5 个 · 轻量积累</option><option>3 个 · 慢慢来</option><option>8 个 · 多学一点</option></select><label>每天学习时间</label><select aria-label="每天学习时间"><option>10 分钟</option><option>15 分钟</option><option>20 分钟</option></select></div><button class="primary" data-action="save-preferences" style="margin-top:26px">保存学习偏好</button>`;}
 connection(){return `<div class="settings-hero">${icon('monitor')}<div><strong>${shared.connected?'电脑已连接':'等待连接电脑'}</strong><small>${shared.connected?'朗读接收中 · 手机可后台播放':'本机词汇与已保存内容仍可学习'}</small></div></div><button class="primary" data-action="scan">${icon('plus')}扫码连接电脑</button><button class="secondary" data-action="toggle-connection" style="width:100%;margin-top:12px">${shared.connected?'停止接收':'启动朗读接收'}</button><div class="settings-label">最近一次接收</div><div class="recent-box"><div class="recent-row"><strong>control</strong><em>今天 09:38</em></div><p class="small-text" style="padding-bottom:15px">已完成朗读 · 本机已收录</p></div><p class="subnote">这里的连接状态为演示数据。</p>`;}
 quiz(){const w=this.word();const choices=[w.en,...words.filter(x=>x.id!==w.id).slice(0,2).map(x=>x.en)];const correct=this.quizAnswer===w.en;return `<div class="stepper"><span class="filled"></span><span class="filled"></span><span class="filled"></span><span></span><span></span></div><div class="eyebrow">先回忆一下 · 词义选择</div><h2 class="quiz-prompt">哪个词表示<br>“${w.cn}”？</h2><p class="small-text" style="margin-bottom:22px">这次先不看提示，试着选一选。</p>${choices.map((x,i)=>`<button class="quiz-choice ${this.quizAnswer===x?(correct?'selected':'wrong'):''}" data-action="answer" data-answer="${x}" ${this.quizAnswer?'disabled':''}><span>${String.fromCharCode(65+i)}</span><span>${x}</span></button>`).join('')}${this.quizAnswer?`<div class="quiz-feedback ${correct?'':'wrong'}" role="status">${correct?'答对了，试着把它放进句子里。':'这次选错了，正确答案是 '+w.en+'。'}<br><span class="small-text">${w.phrase}</span></div><button class="primary" data-action="finish">${correct?'完成这个词':'记下它，稍后再复习'} ${icon('arrow')}</button><button class="ai-inline" data-action="ask-word">${icon('spark')}请 AI 再解释一下</button>`:''}`;}
 review(){const w=words.find(w=>w.status==='待复习');return `<div class="eyebrow">到期复习 · 1 / 3</div><p class="small-text" style="margin-top:15px">先想一想它的意思，再看答案。</p><div class="review-front"><h2>${w.en}</h2><p>${this.reviewShown?w.cn:'回忆一下，先不急着翻看。'}</p><button class="icon-btn" data-action="speak" aria-label="朗读复习词">${icon('speaker')}</button></div>${!this.reviewShown?'<button class="primary" data-action="reveal">查看答案</button>':'<div class="review-controls"><button class="secondary" data-action="review-hard">还需巩固</button><button class="primary" data-action="review-ok">这次记住了</button></div><p class="subnote">这是记忆自评，会与客观测验分开记录。</p>'}`;}
 done(){return `<div class="complete-ring">${icon('check')}</div><h2 class="complete-title">又积累了一点。</h2><p class="complete-text">完成了 ${this.word().en} 的学习与一次练习。<br>之后再回忆几次，让它慢慢熟悉起来。</p><div class="example"><div class="example-label">再记住这一个搭配</div><p class="example-en">${this.word().phrase.split(' · ')[0]}</p><p class="example-cn">${this.word().phrase.split(' · ')[1]}</p></div><button class="primary" data-action="home" style="margin-top:25px">回到今日学习 ${icon('arrow')}</button><p class="subnote">完成一轮练习，不直接等同于掌握。</p>`;}
 history(){return `<div class="settings-hero">${icon('history')}<div><strong>最近的学习</strong><small>听过、练过与自评分别记录</small></div></div><div class="recent-box"><div class="recent-row"><span>control · 学习完成</span><em>${shared.completed.size?'本次演示':'示例记录'}</em></div><div class="recent-row"><span>volume · 待复习</span><em>今天</em></div></div><div class="section-label">本次预览中的对话</div>${this.chat.length?this.chat.filter(m=>m.role==='user').map(m=>`<button class="row-action" data-action="ai"><span class="row-copy"><strong>${esc(m.text)}</strong><small>继续这个话题</small></span>${icon('chevron','chevron')}</button>`).join(''):'<p class="small-text">还没有开始对话，可以到 AI 老师页面问一问。</p>'}`;}
 click(e){const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='send')e.preventDefault();if(['home','words','ai','settings','speech','api','preferences','connection','history','update'].includes(a)){this.go(a);return;}if(a==='word'){this.go('word');return;}if(a==='open-word'){this.wordId=b.dataset.word;this.go('word');return;}if(a==='back'){this.requestId++;this.busy=false;this.route=this.stack.pop()||'home';this.render();return;}if(a==='speak'||a==='speak-sentence'){this.toast('演示播放反馈：'+(this.route==='review'?'volume':this.word().en)+(a==='speak-sentence'?' 的例句':''));return;}if(a==='translate'){this.translation=!this.translation;this.render();return;}if(a==='quiz'){this.quizAnswer=null;this.go('quiz');return;}if(a==='answer'){this.quizAnswer=b.dataset.answer;this.render();return;}if(a==='finish'){shared.completed.add(this.wordId);this.go('done');return;}if(a==='filter'){this.filter=b.dataset.filter;this.render();return;}if(a==='review'){this.reviewShown=false;this.go('review');return;}if(a==='reveal'){this.reviewShown=true;this.render();return;}if(a==='review-hard'||a==='review-ok'){this.go('home');this.toast(a==='review-ok'?'已记录本次自评：这次记住了':'已记录本次自评：还需巩固');return;}if(a==='bookmark'){this.toast('已收藏 '+this.word().en+'（演示）');return;}if(a==='ask-word'){this.route='ai';this.render();this.ask('请用简单的例句解释 '+this.word().en+'。','word');return;}if(a==='recommend'){this.ask('我的基础较弱，今天可以学哪几个常用词？','recommend');return;}if(a==='compare'){this.ask('control 和 manage 有什么区别？','compare');return;}if(a==='express'){this.ask('“我需要一些帮助”用英语怎么说？','express');return;}if(a==='suggest'){this.ask(b.dataset.prompt,'simple');return;}if(a==='send'){const input=this.screen.querySelector('textarea');const text=input?.value.trim();if(text)this.ask(text,'free');else this.toast('先写下你想问的问题。');return;}if(a==='new-chat'){this.requestId++;this.busy=false;this.chat=[];this.render();return;}if(a==='cancel-ai'){this.requestId++;this.busy=false;this.chat.push({role:'assistant',text:'这次演示已取消，你可以修改问题后再问。'});this.render();return;}if(a==='add-recommend'){shared.added.add(b.dataset.word);const extra={help:{en:'help',sound:'/help/',cn:'帮助',pos:'v.',example:'Can you <mark>help</mark> me?',translation:'你能帮我吗？',phrase:'help me · 帮助我',why:'请求帮助时，先记住 Can you help me? 这个常用句。'},ready:{en:'ready',sound:'/ˈredi/',cn:'准备好的',pos:'adj.',example:'I am <mark>ready</mark>.',translation:'我准备好了。',phrase:'be ready · 准备好',why:'ready 表示准备好了，前面常用 am、is 或 are。'},remember:{en:'remember',sound:'/rɪˈmembə/',cn:'记住',pos:'v.',example:'I <mark>remember</mark> this word.',translation:'我记得这个词。',phrase:'remember this word · 记住这个词',why:'先掌握 remember 表示记得、记住的常用意思。'}};if(!words.some(w=>w.id===b.dataset.word)){words.push({id:b.dataset.word,...extra[b.dataset.word],source:'AI 推荐',status:'待学习'});}b.textContent='已加入';b.disabled=true;this.toast('已加入演示学习清单');return;}if(a==='oral'){this.oral();return;}if(a==='test-api'){this.testApi(b);return;}if(a==='save-preferences'){const values=[...this.screen.querySelectorAll('.test-form select')].map(x=>x.value);[shared.prefs.level,shared.prefs.purpose,shared.prefs.newWords,shared.prefs.time]=values;this.go('settings');this.toast('学习偏好已保存（本次预览）');return;}if(a==='toggle-connection'){shared.connected=!shared.connected;this.render();return;}if(a==='scan'){this.sheet('连接电脑','<p>正式应用中，这里会打开扫码相机，扫描电脑提供的配对二维码。</p><div class="test-state">HTML 原型不会打开摄像头或发起连接。</div>');return;}if(a==='privacy'){this.sheet('学习数据与隐私','<p>词汇、笔记、已保存讲解与录音保存在手机。联网提问时仅发送这次学习所需的内容。</p><div class="test-state">当前页面是独立原型，不读取真实学习数据。</div>');return;}if(a==='ducking'){this.toast('音频焦点设置将在正式应用中生效。');return;}if(a==='background'){this.sheet('后台朗读','<p>正式应用中可查看接收服务、电池权限和最近连接记录。</p><div class="test-state">此原型不代表后台连接已经通过验证。</div>');return;}if(a==='add-word'){this.sheet('添加一个词','<label class="test-form"><input aria-label="要添加的英文" placeholder="例如：understand"></label><p style="margin-top:12px">正式应用中可填写中文笔记，再加入词库。</p><button class="primary" data-sheet-add>加入演示词库</button>');this.screen.querySelector('[data-sheet-add]').onclick=()=>{this.screen.querySelector('.overlay').remove();this.toast('添加流程演示完成，词库示例保持不变。');};}}
 input(e){if(e.target.matches('.search input')){this.query=e.target.value;this.screen.querySelector('.word-results').innerHTML=this.wordRows();}if(e.target.matches('.range')){shared.rate=Number(e.target.value);this.screen.querySelector('.rate-label').textContent=(shared.rate/100).toFixed(2)+' ×';}if(e.target.matches('select[aria-label="朗读音色"]')){shared.voice=e.target.value;}}
 toast(text){this.screen.querySelector('.toast')?.remove();const node=document.createElement('div');node.className='toast';node.setAttribute('role','status');node.textContent=text;this.screen.append(node);setTimeout(()=>node.remove(),2400);}
 ask(text,type){if(this.busy)return;this.route='ai';this.chat.push({role:'user',text});this.busy=true;const id=++this.requestId;this.render();this.scrollChat();setTimeout(()=>{if(id!==this.requestId||!this.busy)return;let html='';if(type==='recommend')html='<p>先学 3 个生活中常用的词。每个词只记一个常用意思，再配一句话。</p>'+[['help','帮助'],['ready','准备好的'],['remember','记住']].map(([en,cn])=>`<div class="recommend-word"><span><strong>${en}</strong><small>${cn}</small></span><button data-action="add-recommend" data-word="${en}" ${shared.added.has(en)?'disabled':''}>${shared.added.has(en)?'已加入':'＋'}</button></div>`).join('')+'<p>想先学哪个？确认加入后，再进入学习。</p>';else if(type==='compare')html='<p><strong>先区分两个常见场景：</strong></p><p>调节音量：<br><strong>control the volume</strong><br>强调控制、调节。</p><p>管理团队：<br><strong>manage a team</strong><br>强调管理、组织。</p><p>你想表达的是哪个场景？</p>';else if(type==='express')html='<p>可以说：</p><p><strong>I need some help.</strong><br>我需要一些帮助。</p><p>先记住 <strong>need some help</strong> 这个搭配。你可以试着把它说一遍。</p>';else if(type==='word'||type==='simple')html=`<p><strong>${this.word().en}</strong>：${this.word().cn}。</p><p>${this.word().example.replace(/<\/?mark>/g,'')}<br>${this.word().translation}</p><p>${this.word().why}</p><p>你想在哪一句话里使用它？</p>`;else html='<p>这是交互原型，暂时不会调用真实 AI。</p><p>正式版本会结合当前词汇和学习偏好回答你。可以先体验上方的“推荐新词”或“两个词怎么选”，查看完整的预设学习流程。</p>';this.chat.push({role:'assistant',html});this.busy=false;this.render();this.scrollChat();},850);}
 scrollChat(){const c=this.screen.querySelector('.content');c.scrollTo({top:c.scrollHeight,behavior:'smooth'});}
 sheet(title,html){const previous=document.activeElement;const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-handle"></div><div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="关闭弹窗">${icon('close')}</button></div>${html}</section>`;this.screen.append(overlay);const close=()=>{overlay.remove();previous?.focus();};overlay.querySelector('[data-close]').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close();};overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();close();}if(e.key==='Tab'){const controls=[...overlay.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});overlay.querySelector('button').focus();return overlay;}
 oral(){const overlay=this.sheet('跟读 · '+this.word().en,`<p>先听示范，再按自己的节奏读一遍。</p><div class="wave">${'<span></span>'.repeat(25)}</div><p style="text-align:center;font:22px Georgia,serif;color:#526b45">${this.word().en}</p><button class="secondary" data-demo-listen>${icon('speaker')}听示范</button><button class="primary" data-record><i class="record-dot"></i>开始跟读</button><p class="record-notice">仅演示录音交互，不访问麦克风、不生成评分。</p>`);overlay.querySelector('[data-demo-listen]').onclick=()=>this.toast('演示：播放 '+this.word().en);let recording=false;overlay.querySelector('[data-record]').onclick=e=>{recording=!recording;overlay.classList.toggle('recording',recording);e.currentTarget.textContent=recording?'停止跟读':'再读一次';if(!recording){const note=overlay.querySelector('.record-notice');note.textContent='演示录音已结束，你可以试听并自评。';if(!overlay.querySelector('[data-self-rate]')){const btn=document.createElement('button');btn.className='secondary';btn.dataset.selfRate='';btn.textContent='自评：还需练习';btn.onclick=()=>{overlay.remove();this.toast('已记录自评（演示），不会换算成发音分数。');};note.before(btn);}}};}
 testApi(button){button.disabled=true;button.textContent='正在测试…';const area=this.screen.querySelector('.api-result');area.innerHTML='<div class="test-state">正在连接服务 · 0 秒<br><button class="small-link" data-test-cancel>取消测试</button></div>';let count=0;const ticker=setInterval(()=>{count++;if(!area.isConnected){clearInterval(ticker);return;}const state=area.querySelector('.test-state');if(state?.firstChild)state.firstChild.textContent='正在连接服务 · '+count+' 秒';},1000);const finish=(cancelled)=>{clearInterval(ticker);clearTimeout(timer);if(!area.isConnected)return;area.innerHTML='<div class="test-state">'+(cancelled?'已取消测试。':'演示测试完成 · 耗时 2 秒<br>这里将显示真实接口的成功或失败结果。')+'</div>';button.disabled=false;button.textContent='测试连接';};const timer=setTimeout(()=>finish(false),2000);area.querySelector('[data-test-cancel]').onclick=()=>finish(true);}
}
function init(){document.querySelector('#preview').innerHTML='';views.length=0;['home','word','ai'].forEach((r,i)=>views.push(new App(i,r)));}
function mode(single){document.querySelector('#preview').classList.toggle('single',single);document.querySelector('#overview').setAttribute('aria-pressed',String(!single));document.querySelector('#immersive').setAttribute('aria-pressed',String(single));}
document.querySelector('#overview').onclick=()=>mode(false);document.querySelector('#immersive').onclick=()=>mode(true);document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{mode(true);views[0].go(b.dataset.jump);views[0].element.querySelector('.caption span').textContent=screens[b.dataset.jump];});document.querySelector('#reset').onclick=()=>{views.forEach(a=>{a.requestId++;a.busy=false;});shared.completed.clear();shared.added.clear();words.splice(5);shared.prefs={level:'基础较弱 · 从常用词开始',purpose:'日常生活与工作',newWords:'5 个 · 轻量积累',time:'10 分钟'};shared.rate=100;shared.voice='女声 · af_heart';shared.connected=true;init();mode(false);};init();
document.addEventListener('submit',e=>{if(e.target.matches('.compose-box'))e.preventDefault();});
</script>
</body>
