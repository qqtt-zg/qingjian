<div id="qingjian-learning-v2" class="viz-dotted-background">
<style>

<script>
(()=>{
  const root=document.getElementById('qingjian-learning-v2'),q=s=>root.querySelector(s),body=q('.q-body'),head=q('.q-header'),foot=q('.q-footer'),nav=q('.q-nav'),modal=q('.q-modal');
  const ico=(name,cls='')=>`<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const action=(label,id,cls='q-primary',extra='')=>`<button type="button" class="${cls}" data-action="${id}" ${extra}>${label}</button>`;
  const iconButton=(icon,id,label,extra='')=>action(ico(icon),id,'q-icon',`aria-label="${esc(label)}" ${extra}`);
  const row=(label,desc,icon,id,extra='')=>action(`${ico(icon)}<span class="q-row-copy">${label}<small>${desc}</small></span>${ico('chevron-right','q-chev')}`,id,'q-row',extra);
  const fold=(label,html)=>`<details class="q-fold"><summary>${label}</summary><div class="q-fold-content">${html}</div></details>`;
  const words=[
    {id:'receive',cn:'接收；收到',pos:'v.',example:'I receive your message.',translation:'我收到你的消息。',gap:'I ____ your message.',tag:'待巩固',seen:18,phrase:'receive a message',usage:'receive 后可直接接收到的事物。注意 ei 的字母顺序。'},
    {id:'control',cn:'控制；调节',pos:'v.',example:'You can control the volume.',translation:'你可以调节音量。',gap:'You can ____ the volume.',tag:'待巩固',seen:27,phrase:'control the volume',usage:'control 强调控制或调节状态，常直接接宾语。'},
    {id:'implement',cn:'实施；执行',pos:'v.',example:'We implement this plan.',translation:'我们实施这项计划。',gap:'We ____ this plan.',tag:'待巩固',seen:9,phrase:'implement a plan',usage:'implement 表示把方案或计划付诸执行。'},
    {id:'manage',cn:'管理；处理',pos:'v.',example:'I manage a small team.',translation:'我管理一个小团队。',gap:'I ____ a small team.',tag:'可扩展',seen:16,phrase:'manage a team',usage:'manage 强调安排、管理或处理事务。'},
    {id:'realize',cn:'意识到；认识到',pos:'v.',example:'I realize my mistake.',translation:'我意识到自己的错误。',gap:'I ____ my mistake.',tag:'可扩展',seen:11,phrase:'realize a mistake',usage:'本轮先学“意识到”这个意思；“实现计划”可另与 implement 辨析。'},
    {id:'ready',cn:'准备好的',pos:'adj.',example:'I am ready now.',translation:'我现在准备好了。',gap:'I am ____ now.',tag:'待学习',seen:3,phrase:'be ready',usage:'ready 常与 be 连用，表示准备好的状态。'}
  ];
  const seed=[['14','control',true,0],['14','manage',false,0],['15','manage',true,0],['15','realize',true,0],['16','receive',false,0],['17','implement',false,0],['17','control',true,0],['19','manage',true,0],['19','receive',true,1],['20','receive',false,0],['20','receive',true,1]].map((x,i)=>({id:'old-'+i,date:'2026-10-'+x[0],kind:'spelling',word:x[1],correct:x[2],hint:x[3],answer:x[2]?x[1]:x[1]==='receive'?'recieve':x[1]==='implement'?'implment':'mange',source:'示例历史'}));
  seed.push({id:'old-oral',date:'2026-10-20',kind:'oral',word:'control',score:86.5,source:'示例历史'});
  function initial(){return {tab:'learn',route:'home',word:'receive',workspace:'materials',query:'',filter:'全部',rounds:{},queue:[],queueIndex:0,events:seed.map(x=>({...x})),wordChat:[],wordDraft:'',chat:[{role:'assistant',text:'今天可以先巩固 receive 的拼写，再用一句短句检验用法。你也可以直接告诉我想学什么。'}],chatDraft:'',chatBusy:false,chatAt:0,chatQuestion:'',wordBusy:false,wordAt:0,exam:{phase:'setup',scope:'today',count:10,index:0,questions:[],answers:{},replays:{},graded:false},oral:{word:'receive',phase:'idle',duration:0,at:0,score:null},memories:[{id:'goal',type:'我的目标',text:'日常输入更重视英文拼写，每天学习约10分钟。',source:'来自学习偏好',corrected:false},{id:'receive-order',type:'AI 整理',text:'receive 的 ie / ei 顺序需要再做无提示复测。',source:'10月20日首次拼错，之后在提示下拼对。',corrected:false},{id:'next',type:'AI 建议',text:'先巩固 receive 和 implement；manage 可继续练常用搭配。',source:'近期示例作答与电脑接触记录。',corrected:false}],deletedMemories:[],autoMemory:true,analysis:{phase:'idle',batch:0,total:3,covered:0,snapshot:0,at:0,includeRaw:false},usage:[{task:'今日计划',input:3820,output:620,cached:1200,reasoning:null,turns:2,status:'成功',ms:1940},{task:'学习资料补全',input:2460,output:570,cached:0,reasoning:null,turns:1,status:'成功',ms:1230},{task:'词语辨析',input:1850,output:430,cached:600,reasoning:null,turns:1,status:'成功',ms:980}],assessments:['成功','成功','成功','成功','失败','取消'],quota:500,calendarExpanded:false,selectedDate:'2026-10-20',month:9,year:2026,backup:{auto:true,audio:false,phase:'idle',at:0,last:'今天 09:35',snapshot:null,dirty:false},sync:{phase:'idle',at:0,last:'今天 09:30'},prefs:{minutes:'10',newWords:'5',english:'女声1 · af_heart',chinese:'晓贝 · 女声',rate:'1.00'},returnTo:'me',memoryEdit:'',playing:'',playUntil:0};}
  let state=initial(),connection={phase:'connected',online:true,started:0,finishAt:0,nextAt:0,attempt:0,stopAt:0},toastUntil=0,lastConnection='',sheetReturn=null;
  const saved=window.openai?.widgetState?.privateContent;
  if(saved?.version===2&&['learn','words','ai','me'].includes(saved.tab)){state.tab=saved.tab;state.route=saved.tab==='learn'?'home':saved.tab;}
  function icons(){root.querySelectorAll('button,summary').forEach(e=>e.classList.add('cursor-interaction'));window.lucide?.createIcons({attrs:{width:20,height:20}});}
  function remember(name){if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{prototype:'青简新版四入口确认稿',page:state.tab,screen:state.route,lastAction:name},privateContent:{version:2,tab:state.tab}})).catch(()=>{});}
  function toast(text){q('.q-toast').textContent=text;q('.q-toast').hidden=false;toastUntil=performance.now()+2800;}
  function currentWord(){return words.find(w=>w.id===state.word)||words[0];}
  function round(){return state.rounds[state.word]||(state.rounds[state.word]={answer:'',hint:0,revealed:false,submitted:false,correct:false,attempt:1});}
  function freshRound(id){state.rounds[id]={answer:'',hint:0,revealed:false,submitted:false,correct:false,attempt:(state.rounds[id]?.attempt||0)+1};}
  function normalize(text){return String(text).trim().replace(/\s+/g,' ').toLowerCase();}
  function stopForNavigation(){if(state.oral.phase==='recording'){state.oral.duration=Math.max(1,Math.floor((performance.now()-state.oral.at)/1000));state.oral.phase='recorded';}else if(state.oral.phase==='scoring')state.oral.phase='recorded';state.playing='';}
  function go(route,tab=state.tab){stopForNavigation();state.route=route;state.tab=tab;closeSheet(false);render();remember('打开'+route);}
  function openWord(id,mode='materials'){stopForNavigation();state.wordChats||={};state.wordDrafts||={};state.wordChats[state.word]=state.wordChat;state.wordDrafts[state.word]=state.wordDraft;state.wordBusy=false;state.word=id;state.wordChat=state.wordChats[id]||[];state.wordDraft=state.wordDrafts[id]||'';state.workspace=mode;state.route='word';render();remember('词卡'+mode);}
  function summaryStats(){const rows=state.events.filter(e=>e.kind!=='oral');return {answered:rows.length,independent:rows.filter(e=>e.correct&&!e.hint).length,days:new Set(state.events.filter(e=>e.date>='2026-10-14').map(e=>e.date)).size};}
  function totals(){return state.usage.reduce((a,b)=>({input:a.input+b.input,output:a.output+b.output,cached:a.cached+b.cached}),{input:0,output:0,cached:0});}
  function setFooter(left,right){foot.hidden=!right;foot.innerHTML=right?(left||'')+right:'';}
  function renderHeader(){const main=['home','words','ai','me'].includes(state.route),titles={home:'青简',words:'词库',ai:'AI老师',me:'我的',word:state.workspace==='spell'?'练拼写':'词汇学习',examSetup:'独立小测',exam:'独立小测',examResult:'本次成绩',archive:'学习档案',usage:'用量与执行',services:'语音评测用量',backup:'同步与备份',settings:'设置',preferences:'学习偏好',voices:'朗读设置',api:'AI设置',memoryEdit:'纠正记忆'};const gear=state.route==='me'?iconButton('settings','settings','系统设置'):'';head.innerHTML=(main?(state.route==='ai'?iconButton('panel-left','conversations','展开学习对话'):''):iconButton('arrow-left','back','返回上一页').replace('q-icon','q-icon q-back'))+`<h2 class="q-title">${titles[state.route]||'青简'}</h2>`+gear+`<button type="button" class="q-connection" data-action="connection"></button>`+iconButton('scan-line','scan','扫码连接电脑').replace('q-icon','q-icon q-scan');lastConnection='';renderConnection();}
  function renderNavigation(){nav.hidden=!['home','words','ai','me'].includes(state.route);nav.innerHTML=[['learn','学习','house'],['words','词库','book-open'],['ai','AI老师','sparkles'],['me','我的','user-round']].map(([id,label,icon])=>`<button type="button" data-tab="${id}" ${state.tab===id?'aria-current="page"':''}>${ico(icon)}<span>${label}</span></button>`).join('');}
  function home(){const s=summaryStats();return `<span class="q-kicker">日常输入 · 拼写优先</span><h1 class="q-display">把常用词，<br>写得更稳一点。</h1><p class="q-muted">本次先巩固2个词，再扩展一个搭配。</p><section class="q-hero"><span class="q-kicker">继续今天的学习</span><div class="q-word">receive</div><p class="q-copy">接收；收到</p><p class="q-muted" style="margin-top:10px">上次在提示后拼对，这次试试独立完成。</p>${action(`开始练拼写 ${ico('arrow-right')}`,'start-practice','q-primary q-full')}</section><div class="q-section">按自己的节奏来<span class="q-muted">每天 ${state.prefs.minutes} 分钟</span></div>${row('独立小测','拼写、听写与语境填词，交卷后看结果','notebook-pen','exam-setup')}${row('问问AI老师','根据实际记录，决定先巩固还是扩展','sparkles','open-ai')}<p class="q-note">本周已练习 ${s.days} 天 · 电脑词库 ${words.length} 词<br>全部为演示记录，正常输入不会被练习打断。</p>`;}
  function wordRows(){const list=words.filter(w=>(state.filter==='全部'||w.tag===state.filter)&&(w.id+' '+w.cn).toLowerCase().includes(state.query.toLowerCase()));return list.length?list.map(w=>`<div class="q-row"><button type="button" class="q-row-copy" style="border:0;background:none;text-align:left;padding:0" data-open-word="${w.id}" aria-label="学习 ${w.id}"><strong>${w.id}</strong><small>${w.cn} · ${w.tag}</small></button>${iconButton('volume-2','speak','试听 '+w.id,`data-sound="word-${w.id}"` )}</div>`).join(''):'<p class="q-note">没有找到，试试英文或中文关键词。</p>';}
  function vocabulary(){return `<label class="q-search">${ico('search')}<input class="q-field" data-input="search" aria-label="搜索词汇" placeholder="搜索英文或中文" value="${esc(state.query)}"></label><div class="q-chips">${['全部','待巩固','可扩展'].map(f=>action(f,'filter','q-chip',`data-filter="${f}" aria-pressed="${state.filter===f}"`)).join('')}</div><span class="q-kicker">我的词汇 · ${words.length} 词</span><div class="q-word-items">${wordRows()}</div><p class="q-note">电脑接触记录和手机学习成绩分别保存。</p>`;}
  function inlineTeacher(){return `<details class="q-fold" ${state.wordChat.length?'open':''}><summary>${ico('sparkles')}围绕这个词，继续问老师</summary><div class="q-fold-content"><p class="q-muted">参考：当前词资料、本页已提交作答。不会请求真实AI。</p>${state.wordChat.map(m=>`<div class="q-message" data-role="${m.role}"><small>${m.role==='user'?'我':'青简老师 · 演示'}</small><p>${esc(m.text)}</p></div>`).join('')}<form class="q-ai-form" data-form="word-ai"><textarea class="q-field" data-input="word-ai" aria-label="当前词问题" placeholder="例如：这个词有什么记忆方法？" maxlength="1000">${esc(state.wordDraft)}</textarea><button type="button" class="q-icon" data-action="send-word-ai" aria-label="发送当前词问题" ${state.wordBusy?'disabled':''}>${ico(state.wordBusy?'loader-circle':'send-horizontal',state.wordBusy?'q-spin':'')}</button></form>${state.wordBusy?'<p class="q-muted" role="status">老师正在整理这次演示回答…</p>':''}</div></details>`;}
  function materials(w){return `<span class="q-kicker">来自电脑生词本 · 接触 ${w.seen} 次</span><div class="q-between"><div class="q-word">${w.id}</div>${iconButton('volume-2','speak','试听当前词','data-sound="material-word"')}</div><p class="q-copy">${w.pos} ${w.cn}</p><div class="q-section">放进一句话里</div><div class="q-example">${w.example}</div><p class="q-muted">${w.translation}</p>${action(`${ico('volume-2')}听例句`,'speak','q-text-button','data-sound="material-example"')}${fold('常用搭配与用法',`<p class="q-example">${w.phrase}</p><p>${w.usage}</p>`)}${inlineTeacher()}<p class="q-note">开始拼写后，英文标题和目标词会被隐藏。接触过不代表已经掌握。</p>`;}
  function diffMarkup(a,b){const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));let i=m,j=n,left=[],right=[];while(i||j){if(i&&j&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){const same=a[i-1]===b[j-1];left.unshift(`<span class="${same?'q-good':'q-bad'}">${esc(a[--i])}</span>`);right.unshift(`<span class="${same?'q-good':'q-target-change'}">${esc(b[--j])}</span>`);}else if(j&&dp[i][j]===dp[i][j-1]+1){left.unshift('<span class="q-bad">_</span>');right.unshift(`<span class="q-good">${esc(b[--j])}</span>`);}else{left.unshift(`<span class="q-bad">${esc(a[--i])}</span>`);right.unshift('<span class="q-good">_</span>');}}return `<div class="q-diff"><small>你写的</small>${left.join('')}</div><div class="q-diff"><small>目标词</small>${right.join('')}</div>`;}
  function spelling(w){const s=round(),hintText=s.hint>=2?w.id[0]+' '+Array.from(w.id.slice(1)).map(()=> '·').join(' '):'';let feedback='';if(s.submitted){const a=normalize(s.answer),b=w.id;let issue=a.length<b.length?'漏了字母':a.length>b.length?'多写了字母':'部分字母需要调整';const mismatch=[...a].map((c,i)=>c!==b[i]?i:-1).filter(i=>i>=0);if(a.length===b.length&&mismatch.length===2&&mismatch[1]===mismatch[0]+1&&a[mismatch[0]]===b[mismatch[1]]&&a[mismatch[1]]===b[mismatch[0]])issue='相邻字母顺序颠倒了';feedback=`<div class="q-feedback" data-correct="${s.correct}" role="status"><strong>${s.correct?(s.hint?'提示后拼对了，再安排一次独立复测。':'这次独立拼对了。'):issue}</strong>${diffMarkup(normalize(s.answer).slice(0,80),w.id)}<p class="q-muted">${s.correct?'本次已记录，隔一段时间再测才更能反映记忆。':'第一次答错会保留，不会被后续答对覆盖。'}</p></div>${inlineTeacher()}`;}return `<span class="q-kicker">看义拼写 · 第 ${s.attempt} 次尝试</span><h3 class="q-display" style="font-size:24px">写出这个意思对应的英文。</h3><div class="q-box"><span class="q-kicker">本轮学习词</span><p class="q-copy" style="font-size:20px">${w.pos} ${w.cn}</p></div><form data-form="spelling"><label class="q-label" for="qv2-spell">你的拼写</label><input id="qv2-spell" class="q-field q-spell-input" data-input="spell" value="${esc(s.answer)}" placeholder="在这里输入英文" aria-label="英文拼写答案" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="80" ${s.submitted?'disabled':''}></form>${!s.submitted?`<div class="q-hint-row">${action(`${ico('volume-2')}听读音`,'spell-audio','q-text-button')}${action('首字母提示','spell-hint','q-text-button')}${action('看答案','spell-reveal','q-text-button')}</div>${s.hint>=2?`<p class="q-diff">${esc(hintText)}</p>`:''}${s.revealed?`<div class="q-feedback"><p>答案：<strong>${w.id}</strong></p><p class="q-muted">本次使用答案辅助，不计为独立拼对。</p></div>`:''}<p class="q-note">先试着回忆；需要帮助时再用提示。英文标题和例句已隐藏。</p>`:''}${feedback}`;}
  function oral(w){if(state.oral.word!==w.id)state.oral={word:w.id,phase:'idle',duration:0,at:0,score:null};const o=state.oral;return `<span class="q-kicker">跟读 · 演示录音与评分</span><div class="q-between"><h3 class="q-example">${w.example}</h3>${iconButton('volume-2','speak','听跟读示范','data-sound="oral-reference"')}</div><p class="q-muted">${w.translation}</p><div class="q-box"><div class="q-between"><span class="q-copy" id="qv2-oral-status">${o.phase==='recording'?'正在演示录音':o.phase==='scoring'?'正在演示评测':o.phase==='idle'?'先听示范，再读一次':'演示录音已保留'}</span><span class="q-muted" id="qv2-oral-clock">${o.duration?o.duration+' 秒':'最多30秒'}</span></div>${o.phase==='recording'?action('取消本次录音','oral-cancel','q-text-button'):o.phase==='scoring'?action('取消评测，保留录音','oral-cancel-score','q-text-button'):o.phase!=='idle'?`<div class="q-chips">${action(`${ico('play')}听我的录音`,'speak','q-chip','data-sound="oral-recording"')}${action('重录','oral-start','q-chip')}</div>`:''}</div>${o.phase==='scored'?`<span class="q-kicker">评分示例 · 不是真实服务返回</span><div class="q-grade">86.5 <span style="font-size:18px;letter-spacing:0">/ 100</span></div><p class="q-muted">准确度87 · 流利度82 · 完整度100</p><div class="q-feedback"><strong>${w.id} · 示例反馈</strong><p>先听示范，再回放自己的录音，注意音节与重音。</p>${action(`${ico('volume-2')}听反馈`,'speak','q-text-button','data-sound="oral-feedback"')}</div>${inlineTeacher()}`:'<p class="q-note">此确认稿不访问麦克风、不上传录音，也不消耗讯飞额度。</p>'}`;}
  function wordPage(){const w=currentWord();let html=`<div class="q-segments" aria-label="词卡学习方式">${[['materials','资料'],['spell','拼写'],['oral','跟读']].map(([id,label])=>action(label,'workspace','',`data-mode="${id}" aria-pressed="${state.workspace===id}"`)).join('')}</div>`;if(state.workspace==='materials'){setFooter(action('问老师','word-teacher','q-secondary'),action('开始拼写','word-spell'));return html+materials(w);}if(state.workspace==='spell'){const s=round();setFooter(action('看资料','word-materials','q-secondary'),action(s.submitted?(s.correct?'下一个词':'遮住再拼一次'):'检查答案',s.submitted?(s.correct?'next-word':'retry-word'):'check-spelling'));return html+spelling(w);}const oralHtml=oral(w),o=state.oral;const label=o.phase==='recording'?'停止录音':o.phase==='scoring'?'正在评估…':o.phase==='recorded'?'评估发音':o.phase==='scored'?'练拼写':'开始跟读';setFooter(o.phase==='scored'?action('听反馈','oral-feedback','q-secondary'):action('练拼写','word-spell','q-secondary'),action(label,'oral-primary','q-primary',o.phase==='scoring'?'disabled':''));return html+oralHtml;}
  function examSetup(){const e=state.exam;if(e.phase==='running'&&e.questions.length){setFooter(null,action('继续未完成小测','exam-continue'));return `<span class="q-kicker">草稿与题目已保留</span><h1 class="q-display">接着上次，<br>独立完成这一轮。</h1><div class="q-box"><p class="q-copy">本轮${e.questions.length}题 · 已填写 ${e.questions.filter(w=>(e.answers[w.id]||'').trim()).length}题</p><p class="q-note">题目和规则保持不变，继续作答后再统一交卷。</p></div>`;}const available=e.scope==='mistakes'?words.filter(w=>w.tag==='待巩固'):e.scope==='custom'&&e.selected?words.filter(w=>e.selected.includes(w.id)):words,actual=Math.min(e.count,available.length);setFooter(null,action(`开始 ${actual} 题小测`,'exam-start','q-primary',actual===0?'disabled':''));return `<span class="q-kicker">独立作答 · 交卷后统一反馈</span><h1 class="q-display">检验一下，<br>能不能自己拼出来。</h1><div class="q-section">选择范围</div><div class="q-chips">${[['today','今天学习'],['week','本周词汇'],['mistakes','待巩固词'],['custom','自选词汇']].map(([id,label])=>action(label,'exam-scope','q-chip',`data-scope="${id}" aria-pressed="${e.scope===id}"`)).join('')}</div>${e.scope==='custom'?words.map(w=>`<label class="q-check"><input type="checkbox" data-check="exam-word" value="${w.id}" ${!e.selected||e.selected.includes(w.id)?'checked':''}>${w.id} · ${w.cn}</label>`).join(''):''}<label class="q-label" for="qv2-count">题数</label><select class="q-small-select" id="qv2-count" data-select="exam-count">${[5,10,20].map(n=>`<option value="${n}" ${e.count===n?'selected':''}>${n}题</option>`).join('')}</select><div class="q-box"><p class="q-copy">看义拼写、听写、语境填词</p><p class="q-note">不限时，可修改或跳过。交卷前不显示答案、提示或AI解答；未答题单列并计入未答对。</p></div><p class="q-note">当前演示材料最多 ${available.length} 词，每词出一题；不足所选题数时按实际材料组卷。</p>${e.phase==='running'?action('继续未完成小测','exam-continue','q-text-button'):''}`;}
  function examPage(){const e=state.exam,w=e.questions[e.index],kind=['看义拼写','听写','语境填词'][e.index%3],done=e.questions.filter(w=>String(e.answers[w.id]||'').trim()).length;setFooter(action('上一题','exam-prev','q-secondary',e.index===0?'disabled':''),action(e.index+1===e.questions.length?'交卷':'下一题',e.index+1===e.questions.length?'exam-submit':'exam-next'));return `<div class="q-between"><span class="q-kicker">${kind} · ${e.index+1} / ${e.questions.length}</span>${action('答题卡','exam-sheet','q-text-button')}</div><div class="q-progress" aria-label="考试进度"><span style="width:${(e.index+1)/e.questions.length*100}%"></span></div>${e.index%3===1?`<h3 class="q-display" style="font-size:24px">听一听，写出英文。</h3>${action(`${ico('volume-2')}播放题目`,'exam-listen','q-secondary q-full')}<p class="q-note" id="qv2-listen-status">播放状态为演示 · 已重播 ${e.replays[w.id]||0} 次</p>`:e.index%3===2?`<span class="q-kicker">按本轮学习词填写</span><div class="q-example">${w.gap}</div><p class="q-muted">${w.translation}</p><p class="q-copy" style="margin:14px 0">提示词义：${w.cn}</p>`:`<h3 class="q-display" style="font-size:24px">${w.cn}</h3><p class="q-muted">${w.pos} · 写出本轮学习的英文词</p>`}<form data-form="exam" style="margin-top:28px"><label class="q-label" for="qv2-exam">你的答案</label><input id="qv2-exam" data-input="exam" class="q-field q-spell-input" placeholder="填写英文" aria-label="小测英文答案" value="${esc(e.answers[w.id]||'')}" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="80"></form><p class="q-note" id="qv2-exam-status">已填写 ${done} / ${e.questions.length} 题。${e.index+1===e.questions.length?'点击交卷后统一查看结果。':'答案已留在本次演示，可返回修改。'}</p>${action('暂存并返回学习','exam-pause','q-text-button')}`;}
  function examResult(){const e=state.exam,rows=e.questions.map((w,i)=>({w,kind:['看义拼写','听写','语境填词'][i%3],answer:e.answers[w.id]||'',correct:normalize(e.answers[w.id]||'')===w.id})),correct=rows.filter(r=>r.correct).length;setFooter(action('学习档案','open-archive','q-secondary'),action('练错词','practice-mistakes'));return `<span class="q-kicker">本次小测 · 演示成绩</span><h1 class="q-display">每一次检查，<br>都让下一步更清楚。</h1><div class="q-grade">${correct}<span style="font-size:23px;letter-spacing:0"> / ${rows.length}</span></div><p class="q-muted">答对 ${correct} 题 · 未答 ${rows.filter(r=>!r.answer.trim()).length} 题</p><div class="q-stat-row">${[0,1,2].map(k=>{const group=rows.filter((_,i)=>i%3===k);return `<div><b>${group.filter(r=>r.correct).length}/${group.length}</b>${['看义拼写','听写','语境填词'][k]}</div>`;}).join('')}</div>${rows.map(r=>`<div class="q-answer-card"><div class="q-between"><strong>${r.w.id}</strong><span class="q-pill">${r.correct?'答对':'待巩固'} · ${r.kind}</span></div><p class="q-muted">你的答案：${esc(r.answer||'未作答')}</p>${!r.correct?diffMarkup(normalize(r.answer).slice(0,80),r.w.id):''}</div>`).join('')}${action(`${ico('sparkles')}请老师按结果给建议`,'exam-ask','q-text-button')}<p class="q-note">作答与提示、发音、自评分开记录；本轮结果不会覆盖此前的错误。</p>`;}

  function calendar(){
    const selectedDay=new Date(state.selectedDate+'T00:00:00Z'),weekStart=new Date(selectedDay),dates=[],expanded=state.calendarExpanded;

    const weekEnd=new Date(weekStart);weekEnd.setUTCDate(weekEnd.getUTCDate()+6);

    return `<div class="q-box"><div class="q-calendar-title"><span>${title}</span><span style="display:flex">${iconButton('chevron-left','month-prev',expanded?'上一个月':'上一周')}${iconButton('chevron-right','month-next',expanded?'下一个月':'下一周',nextBlocked?'disabled':'')}</span></div><div class="q-weekdays">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="q-days" id="qv2-calendar-days">${cells.join('')}</div><button type="button" class="q-calendar-toggle" data-action="calendar-toggle" aria-expanded="${expanded}" aria-controls="qv2-calendar-days">${expanded?'收起月历':'展开月历'}${ico(expanded?'chevron-up':'chevron-down')}</button><div class="q-calendar-records"><span class="q-kicker">${state.selectedDate} · ${selected.length}条示例记录</span>${selected.length?selected.map(e=>`<div class="q-calendar-record">${e.word} · ${e.kind==='oral'?'跟读评分示例 '+e.score:e.kind==='exam'?'小测 · '+(e.correct?'答对':'未答对'):e.correct?(e.hint?'提示后拼对':'独立拼对'):'首次拼写未答对'}</div>`).join(''):'<p class="q-muted">这一天没有演示学习记录。</p>'}</div></div>`;

  function myPage(){const s=summaryStats(),t=totals();return `<span class="q-kicker">我的学习 · 演示档案</span><h1 class="q-my-heading">每一步，都有记录。</h1><p class="q-muted">${state.prefs.minutes}分钟／天 · 日常输入与英文拼写</p><div class="q-stat-row q-my-stats"><div><b>${s.answered}</b>累计作答</div><div><b>${s.independent}</b>独立答对</div><div><b>${s.days}</b>本周学习日</div></div><button type="button" class="q-quota" data-action="open-services"><span class="q-between"><span>语音评分 · 免费次数</span>${ico('chevron-right')}</span><span class="q-between" style="margin-top:7px"><strong>今日已提交 ${state.assessments.length} 次</strong><span class="q-muted">每日参考 ${state.quota} 次</span></span><small>本机估算剩余 ${Math.max(0,state.quota-state.assessments.length)} 次 · 实际额度以平台为准</small></button><div class="q-section">学习日历<span class="q-muted">点日期看记录</span></div>${calendar()}${row('学习档案与记忆','查看当前重点、依据，纠正老师对你的理解','brain','open-archive')}${state.exam.graded?row('最近小测',`${state.exam.questions.length}题 · 查看已提交结果`,'notebook-pen','open-exam-result'):''}${row('用量与服务',`${(t.input+t.output).toLocaleString()} tokens · 评测提交 ${state.assessments.length} 次`,'chart-no-axes-combined','open-usage')}${row('电脑来源',`${words.length}个示例词 · 最近同步 ${state.sync.last}`,'monitor','sync-info')}${row('同步与备份',`电脑词库 ${state.sync.last} · 备份 ${state.backup.last||'尚未完成'}`,'archive','open-backup')}<p class="q-note">统计来自示例记录，打开页面不计为学习。系统设置统一在右上角。</p>`;}
  function analysisPanel(){const a=state.analysis,active=a.phase==='running';return `<div class="q-box"><div class="q-between"><span class="q-copy">整体学习分析</span><span class="q-pill">${a.phase==='done'?'已完成':active?'分析中':a.phase==='paused'?'已暂停':'按需更新'}</span></div><p class="q-note">全部学习明细 ${a.snapshot||state.events.length} 条＋对话摘要。${a.includeRaw?'本次还包含示例对话原文。':'不必每次重复发送全部历史。'}</p>${a.phase!=='idle'?`<div class="q-progress" role="progressbar" aria-label="整体分析进度" aria-valuemin="0" aria-valuemax="${a.total}" aria-valuenow="${a.batch}"><span style="width:${a.batch/a.total*100}%"></span></div><p class="q-muted">覆盖 ${a.covered} / ${a.snapshot} 条 · ${a.batch} / ${a.total} 批</p>`:''}<label class="q-check"><input type="checkbox" data-check="analysis-raw" ${a.includeRaw?'checked':''} ${active||a.phase==='paused'?'disabled':''}>本次包含对话原文</label>${active?action('取消分析，保留进度','analysis-cancel','q-secondary q-full'):action(a.phase==='paused'?'继续分析':a.phase==='done'?'重新分析全部历史':'分析全部历史','analysis-start','q-primary q-full')}<p class="q-note">这里按演示批次推进，不调用接口；完成全部批次后才显示已完成。</p></div>`;}
  function archivePage(){return `<span class="q-kicker">完整记录是依据，记忆用于延续学习</span><h1 class="q-display">老师逐渐了解你，<br>也允许你纠正。</h1><p class="q-muted">真实成绩单独保存；下面的AI整理可以修改或删除。</p><label class="q-check"><input type="checkbox" data-check="auto-memory" ${state.autoMemory?'checked':''}>自动更新学习记忆</label>${state.memories.length?state.memories.map(m=>`<article class="q-memory"><span class="q-pill">${m.corrected?'我已纠正':m.type}</span><p>${esc(m.text)}</p><details class="q-reference"><summary>查看依据</summary><p>${esc(m.source)}</p></details><div class="q-memory-actions">${action('纠正','memory-edit','q-text-button',`data-memory="${m.id}"`)}${action('删除这条记忆','memory-delete','q-text-button',`data-memory="${m.id}"`)}</div></article>`).join(''):'<p class="q-note">当前没有保留的记忆，原始学习记录仍在。</p>'}${analysisPanel()}${row('查看逐次记录','按日期回看首次错误、提示和复测','history','records-back')}`;}
  function memoryEditor(){const m=state.memories.find(x=>x.id===state.memoryEdit);if(!m){state.route='archive';return archivePage();}setFooter(action('取消','memory-cancel','q-secondary'),action('保存纠正','memory-save'));return `<span class="q-kicker">你的明确纠正优先</span><h1 class="q-display">让老师理解得更准确。</h1><label for="qv2-memory" class="q-label">记忆内容</label><textarea id="qv2-memory" class="q-field" data-input="memory" maxlength="300">${esc(m.text)}</textarea><p class="q-note">只修改这条学习记忆，原始作答与成绩保留。之后自动分析不会覆盖你的明确纠正。</p>`;}
  function usagePage(){const t=totals();return `<span class="q-kicker">AI用量 · 以下全部为演示统计</span><h1 class="q-display">知道每次调用，<br>花在了哪里。</h1><div class="q-stat-row"><div><b>${t.input.toLocaleString()}</b>输入token</div><div><b>${t.output.toLocaleString()}</b>输出token</div></div><p class="q-muted">缓存命中 ${t.cached.toLocaleString()}，已包含在输入中，不重复累计。推理token未报告时显示未知。</p><div class="q-section">按任务查看</div>${state.usage.map((u,i)=>`<details class="q-fold"><summary><span>${u.task}</span><span class="q-muted" style="margin-left:auto">${(u.input+u.output).toLocaleString()} tokens</span></summary><div class="q-fold-content"><p>输入 ${u.input} · 输出 ${u.output} · 缓存 ${u.cached}</p><p>推理token：${u.reasoning??'未知／服务商未报告'}</p><p>${u.turns}轮调用 · ${(u.ms/1000).toFixed(2)}秒 · ${u.status}</p><p class="q-muted">示例任务${i+1}，不记录密钥或模型隐藏思考。</p></div></details>`).join('')}${row('语音评测次数',`本App今日提交 ${state.assessments.length} 次，每日参考 ${state.quota}`,'mic','open-services')}`;}
  function servicesPage(){return `<span class="q-kicker">讯飞语音评测 · 本地用量示例</span><h1 class="q-display">评测次数，<br>与学习成绩分开看。</h1><div class="q-grade">${state.assessments.length}<span style="font-size:18px;letter-spacing:0"> 次提交</span></div><div class="q-stat-row">${['成功','失败','取消'].map(s=>`<div><b>${state.assessments.filter(x=>x===s).length}</b>${s}</div>`).join('')}</div><label class="q-label" for="qv2-quota">每日额度参考（可调整）</label><input class="q-field" type="number" id="qv2-quota" data-input="quota" min="0" max="100000" value="${state.quota}">${action('保存额度参考','quota-save','q-text-button')}<div class="q-box"><p class="q-copy">账号实际剩余额度：未知</p><p class="q-note">本App提交次数不等同于平台计费；其他设备调用也可能使用额度。这里只显示本地统计，不把估算当作账号余额。</p></div><p class="q-note">离线朗读不计入本地评测提交统计。演示评分不会产生真实调用。</p>`;}
  function backupPage(){const b=state.backup,connected=connection.phase==='connected';return `<span class="q-kicker">手机与已配对电脑 · 演示数据流</span><h1 class="q-display">平时积累，<br>连接时留一份备份。</h1><div class="q-box"><div class="q-between"><span class="q-copy">电脑生词本 → 手机</span><span class="q-pill">${state.sync.phase==='running'?'同步中':'单向同步'}</span></div><p class="q-note">${words.length}词 · 最近同步 ${state.sync.last}。手机笔记与成绩保留，接触次数不等于会拼写。</p>${action(state.sync.phase==='running'?'正在演示同步…':'同步电脑词库','sync-now','q-secondary q-full',state.sync.phase==='running'?'disabled':'')}</div><div class="q-box"><div class="q-between"><span class="q-copy">手机档案 → 电脑</span><span class="q-pill">${b.phase==='running'?'备份中':b.phase==='waiting'?'等待连接':'可读备份'}</span></div><p class="q-note">最近成功：${b.last||'尚未完成'}${b.dirty?' · 有新增记录待备份':''}</p><label class="q-check"><input type="checkbox" data-check="backup-auto" ${b.auto?'checked':''}>连接电脑后自动备份变化</label><label class="q-check"><input type="checkbox" data-check="backup-audio" ${b.audio?'checked':''}>同时包含跟读录音文件</label>${action(b.phase==='running'?'正在演示备份…':connected?'立即备份':'加入待备份队列','backup-now','q-primary q-full',b.phase==='running'?'disabled':'')}${action('查看备份内容','backup-manifest','q-text-button')}<p class="q-note">备份词库、学习记录、对话、记忆、评分与用量。不包含API密钥、配对凭证或模型；录音默认关闭。</p></div><p class="q-note">此原型不传文件。正式版合并变化后再上传，不会每次按键都备份；网盘备份留待后续。</p>`;}
  function settingsPage(){return `<span class="q-kicker">不常修改的选项，集中在这里</span>${row('学习偏好',`每天${state.prefs.minutes}分钟 · ${state.prefs.newWords}个新词`,'sliders-horizontal','preferences')}${row('AI接口与模型','接口、工具和测试连接','sparkles','api')}${row('朗读设置',`${state.prefs.english} · ${state.prefs.rate}×`,'volume-2','voices')}${row('语音评测','服务配置与本地次数','mic','open-services')}${row('用量与执行记录','按任务查看token和调用详情','chart-no-axes-combined','open-usage')}${row('数据、同步与备份','查看备份状态与数据归属','archive','open-backup')}${row('更新与关于','新版UI确认稿 · 不修改已安装App','info','about')}<p class="q-note">本轮仅确认界面归属。实际配置仍在正式App中管理。</p>`;}
  function preferencesPage(){setFooter(null,action('保存偏好','prefs-save'));return `<span class="q-kicker">目标由你决定</span><h1 class="q-display">每天一点，<br>按自己的节奏。</h1><label class="q-label">每天学习时间</label><select class="q-small-select" data-select="minutes">${['10','15','20'].map(x=>`<option ${state.prefs.minutes===x?'selected':''} value="${x}">${x}分钟</option>`).join('')}</select><label class="q-label" style="margin-top:20px">期望新词数量</label><select class="q-small-select" data-select="newWords">${['3','5','8'].map(x=>`<option ${state.prefs.newWords===x?'selected':''} value="${x}">${x}个</option>`).join('')}</select><p class="q-note">当前学习重点：日常输入与独立拼写。这是学习目标，不是已完成记录。</p>`;}
  function voicePage(){return `<span class="q-kicker">声音偏好 · 演示选择</span>${[['english','英文音色',['女声1 · af_heart','男声1','女声2']],['chinese','中文音色',['晓贝 · 女声','晓晓 · 女声','云希 · 男声']],['rate','朗读语速',['0.75','1.00','1.25','1.50']]].map(([key,label,values])=>`<label class="q-label" style="margin-top:18px">${label}</label><select class="q-small-select" data-select="${key}">${values.map(v=>`<option value="${v}" ${state.prefs[key]===v?'selected':''}>${v}</option>`).join('')}</select>`).join('')}<div style="margin-top:23px">${action(`${ico('volume-2')}试听中英文`,'speak','q-secondary q-full','data-sound="settings-preview"')}</div><p class="q-note">当前只展示播放状态，不调用真实TTS。</p>`;}
  function apiPage(){return `<span class="q-kicker">接口与模型 · 配置归属示意</span><h1 class="q-display">用你自己的AI，<br>延续你的学习。</h1><div class="q-box"><p class="q-copy">个人模型 · 演示配置</p><p class="q-note">正式版在此配置HTTPS地址、模型、密钥和学习工具。本原型不收集真实密钥。</p></div>${action('体验测试连接反馈','test-api','q-primary q-full')}<p class="q-note" id="qv2-api-status" role="status"></p>${row('查看token用量','与所有学习任务统一统计','chart-no-axes-combined','open-usage')}`;}
  function render(keep=false){const top=keep?body.scrollTop:0;setFooter(null,null);renderHeader();const views={home,words:vocabulary,word:wordPage,examSetup,exam:examPage,examResult,ai:aiPage,me:myPage,archive:archivePage,memoryEdit:memoryEditor,usage:usagePage,services:servicesPage,backup:backupPage,settings:settingsPage,preferences:preferencesPage,voices:voicePage,api:apiPage};body.innerHTML=(views[state.route]||home)();renderNavigation();icons();body.scrollTop=top;}
  function blockBackground(on){for(const e of [head,body,foot,nav])e.inert=on;}
  function showSheet(title,html){sheetReturn=document.activeElement;modal.innerHTML=`<section class="q-sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="q-between"><h3>${esc(title)}</h3>${iconButton('x','close-sheet','关闭弹窗')}</div>${html}</section>`;modal.hidden=false;blockBackground(true);icons();modal.querySelector('button,input,textarea,select')?.focus();}
  function closeSheet(restore=true){if(modal.hidden)return;modal.hidden=true;modal.innerHTML='';blockBackground(false);if(restore&&sheetReturn?.isConnected)sheetReturn.focus();sheetReturn=null;}
  function headerBack(){if(state.route==='word')go(state.tab==='words'?'words':'home');else if(state.route==='exam'){state.exam.phase='running';go('home','learn');}else if(['examSetup','examResult'].includes(state.route))go('home','learn');else if(state.route==='memoryEdit')go('archive');else if(['preferences','voices','api'].includes(state.route))go('settings','me');else if(state.route==='services')go(state.serviceReturn||'me','me');else go('me','me');}
  function record(event){state.events.push({id:'demo-'+state.events.length,date:'2026-10-20',source:'本次演示操作',...event});state.backup.dirty=true;}
  function checkSpelling(){const s=round();if(s.submitted)return;const input=q('[data-input=spell]'),value=input?.value??s.answer;if(!value.trim()){input?.setCustomValidity('先尝试写出英文，或者使用提示。');input?.reportValidity();return;}s.answer=value.slice(0,80);s.correct=normalize(s.answer)===currentWord().id;s.submitted=true;record({kind:'spelling',word:state.word,answer:s.answer,correct:s.correct,hint:s.hint});render(true);remember('提交拼写');}
  function startPractice(ids=['receive','implement','manage']){state.queue=ids;state.queueIndex=0;freshRound(ids[0]);openWord(ids[0],'spell');}
  function nextWord(){const list=state.queue.length?state.queue:words.map(w=>w.id);let index=state.queue.length?state.queueIndex:list.indexOf(state.word);if(index+1>=list.length){showSheet('本轮练习小结',`<p class="q-copy" style="margin-top:15px">本轮演示练习已完成。首次错误、提示与后续答对分别保留。</p>${action('查看学习档案','open-archive','q-primary q-full')}${action('返回学习','open-home','q-text-button')}`);return;}state.queueIndex=index+1;freshRound(list[index+1]);openWord(list[index+1],'spell');}
  function startExam(){const e=state.exam;if(e.phase==='running'&&e.questions.length){go('exam','learn');return;}let selected=e.scope==='mistakes'?words.filter(w=>w.tag==='待巩固'):e.scope==='custom'&&e.selected?words.filter(w=>e.selected.includes(w.id)):words;if(!selected.length){toast('先选择至少一个词。');return;}e.questions=selected.slice(0,e.count);e.answers={};e.replays={};e.index=0;e.graded=false;e.phase='running';go('exam','learn');}
  function submitExam(){const e=state.exam;if(e.graded){go('examResult','learn');return;}e.graded=true;e.phase='done';e.questions.forEach((w,i)=>record({kind:'exam',mode:['看义拼写','听写','语境填词'][i%3],word:w.id,answer:e.answers[w.id]||'',correct:normalize(e.answers[w.id]||'')===w.id,hint:0,replays:e.replays[w.id]||0}));go('examResult','learn');remember('交卷');}
  function examSheet(){const e=state.exam;showSheet('答题卡',`<p class="q-note">已填答案用浅色标记，结果在交卷后揭晓。</p><div class="q-exam-grid">${e.questions.map((w,i)=>action(String(i+1),'exam-jump','',`data-index="${i}" data-answered="${!!(e.answers[w.id]||'').trim()}" aria-label="第${i+1}题${(e.answers[w.id]||'').trim()?'已填写':'未填写'}"`)).join('')}</div>${action('继续作答','close-sheet','q-secondary q-full')}`);}
  function askAI(text,inWord=false){if(!text.trim()){toast('先写下问题。');return;}if(inWord){if(state.wordBusy)return;state.wordChat.push({role:'user',text});state.wordDraft='';state.wordBusy=true;state.wordAt=performance.now()+900;}else{if(state.chatBusy)return;state.chat.push({role:'user',text});state.chatDraft='';state.chatBusy=true;state.chatAt=performance.now()+1000;state.chatQuestion=text;}render(true);remember('提问演示');}
  function answerText(question){if(/realize|implement|区分/.test(question))return '这次先记两个具体场景：\nrealize a mistake：意识到错误。\nimplement a plan：实施计划。\n你可以先分别拼出两个词，再用自己的短句表达。';if(/小测|考试/.test(question)){const e=state.exam;if(!e.graded)return '当前还没有完成这次小测。可以先独立作答，交卷后再根据真实结果安排下一步。';const bad=e.questions.filter(w=>normalize(e.answers[w.id]||'')!==w.id);return bad.length?'本次示例小测中，需要再巩固：'+bad.map(w=>w.id).join('、')+'。\n建议先各做一次看义拼写，再隔几题复测。听写与拼写结果会分别记录。':'本次示例小测全部答对了。可以隔天换一种提示再测，不必马上增加大量新词。';}return '从示例记录看，receive 上次是在提示后拼对，本次先做无提示拼写；implement 可再练一次。\nmanage 已有独立答对记录，可以扩展 manage a team 的搭配。\n这些是演示建议，可在学习档案中查看依据或纠正。';}
  function startAnalysis(){const a=state.analysis;if(a.phase==='running')return;if(a.phase!=='paused'){a.batch=0;a.covered=0;a.snapshot=state.events.length;}a.phase='running';a.at=performance.now()+700;render(true);remember('开始全量分析演示');}
  function updateMemories(){if(!state.autoMemory)return;const m=state.memories.find(x=>x.id==='receive-order');if(m&&!m.corrected){const last=state.events.filter(e=>e.word==='receive'&&e.kind!=='oral').at(-1);if(last){m.text=last.correct&&!last.hint?'receive 最近一次已独立拼对，可以隔天复测；既往错误仍保留。':'receive 仍需安排无提示拼写，提示后答对与独立答对分别看。';m.source='依据示例记录及本次已提交作答整理。';}}}
  function beginBackup(){const b=state.backup;if(connection.phase!=='connected'){b.phase='waiting';b.dirty=true;toast('已排队，连接恢复后再备份；不会自行启动已停止的连接。');}else{b.phase='running';b.at=performance.now()+1000;}if(state.route==='backup')render(true);}
  function manifest(){const b=state.backup,s=b.snapshot||{words:words.length,events:seed.length,usage:3,audio:false};showSheet('备份内容示例',`<p class="q-note">${b.last||'尚未备份'} · 可读压缩包</p><div class="q-row"><span class="q-row-copy">词库与学习明细<small>${s.words}词 · ${s.events}条记录</small></span>${ico('check')}</div><div class="q-row"><span class="q-row-copy">对话、记忆、计划与评分<small>包含示例文本和结果</small></span>${ico('check')}</div><div class="q-row"><span class="q-row-copy">AI用量<small>${s.usage}项示例任务</small></span>${ico('check')}</div><p class="q-note">${s.audio?'包含演示录音条目':'未包含录音文件'} · 不包含密钥、配对地址和模型</p>${action('关闭','close-sheet','q-primary q-full')}`);}
  function speak(key='sample'){if(state.oral.phase==='recording'){toast('先停止录音，再听示范。');return;}state.playing=state.playing===key?'':key;state.playUntil=performance.now()+1300;root.querySelectorAll('[data-sound]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.sound===state.playing)));toast(state.playing?'正在演示播放状态，不输出真实音频。':'已停止演示播放。');}
  function startOral(){state.playing='';state.oral={word:state.word,phase:'recording',duration:0,at:performance.now(),score:null};render(true);}

  function renderConnection(){const b=q('.q-connection');if(!b)return;const c=connection,left=Math.max(0,Math.ceil((60000-(performance.now()-c.started))/1000)),text={connected:'已连接',idle:'重新连接',connecting:'连接中',reconnecting:`重连 ${String(left).padStart(2,'0')}s`,stopping:'正在停止'}[c.phase],signature=c.phase+text;if(signature!==lastConnection){lastConnection=signature;b.innerHTML=c.phase==='connected'?`<span class="q-dot" aria-hidden="true"></span><span>${text}</span>`:c.phase==='idle'?ico('rotate-cw')+`<span>${text}</span>`:ico('loader-circle','q-spin')+`<span>${text}</span>`;icons();}b.dataset.state=c.phase;b.disabled=c.phase==='stopping';b.setAttribute('aria-label',c.phase==='idle'?'重新连接电脑':c.phase==='connected'?'电脑已连接，点击停止连接':c.phase==='stopping'?'正在停止连接':`正在${c.phase==='connecting'?'连接':'重连'}，点击停止连接`);q('[data-action=demo-timeout]').disabled=!['connecting','reconnecting'].includes(c.phase);}
  function beginConnection(phase='connecting'){const now=performance.now();Object.assign(connection,{phase,started:now,attempt:1,finishAt:now+1000,nextAt:0});renderConnection();}
  function stopConnection(){Object.assign(connection,{phase:'stopping',started:0,finishAt:0,nextAt:0,stopAt:performance.now()+300});if(state.backup.phase==='running'){state.backup.phase='waiting';state.backup.dirty=true;}if(state.sync.phase==='running')state.sync.phase='idle';renderConnection();if(state.route==='backup')render(true);}
  function torch(on){const scanner=q('.q-scanner'),button=q('.q-torch');scanner.dataset.torch=on?'on':'off';button.setAttribute('aria-pressed',String(on));button.setAttribute('aria-label',on?'关闭手电筒':'打开手电筒');q('.q-torch-icon').innerHTML=ico(on?'flashlight':'flashlight-off');q('.q-torch-label').textContent=on?'关闭手电筒':'打开手电筒';icons();}

  function runAction(id,b){switch(id){
    case 'send-ai':askAI(state.chatDraft);break;case 'send-word-ai':askAI(state.wordDraft,true);break;case 'oral-feedback':speak('oral-feedback');break;case 'open-home':go('home','learn');break;case 'open-ai':go('ai','ai');break;case 'start-practice':startPractice();break;

    case 'workspace':if(state.workspace==='spell'&&b.dataset.mode!=='spell'&&!round().submitted){round().hint=3;toast('离开盲写查看英文，本轮按辅助作答记录。');}stopForNavigation();state.workspace=b.dataset.mode;render();break;

    case 'word-materials':if(!round().submitted){round().hint=3;toast('本轮看过英文资料，后续答对会标为辅助作答。');}state.workspace='materials';render();break;
    case 'word-teacher':q('.q-fold:last-of-type')?.setAttribute('open','');q('[data-input=word-ai]')?.focus();q('[data-input=word-ai]')?.scrollIntoView({block:'nearest'});break;

    case 'exam-listen':{const w=state.exam.questions[state.exam.index];state.exam.replays[w.id]=(state.exam.replays[w.id]||0)+1;speak('exam-audio');q('#qv2-listen-status').textContent='演示播放状态 · 已重播 '+state.exam.replays[w.id]+' 次';break;}
    case 'exam-sheet':examSheet();break;
    case 'exam-jump':state.exam.index=Number(b.dataset.index);closeSheet(false);render();break;
    case 'exam-submit':submitExam();break;case 'open-exam-result':go('examResult','learn');break;case 'exam-pause':go('home','learn');toast('本次演示草稿已保留，可从独立小测继续。');break;
    case 'practice-mistakes':{const bad=state.exam.questions.filter(w=>normalize(state.exam.answers[w.id]||'')!==w.id).map(w=>w.id);if(bad.length)startPractice(bad);else toast('本次全部答对，可以隔天再测。');break;}

    case 'ai-suggestion':state.chatDraft=b.dataset.question;render(true);q('[data-input=ai]')?.focus();break;
    case 'cancel-ai':state.chatBusy=false;state.chatAt=0;state.chatDraft=state.chatQuestion;render(true);toast('演示请求已取消，问题保留。');break;
    case 'conversations':showSheet('学习对话',`${row('日常拼写','当前演示对话','messages-square','close-sheet')}${row('新建学习对话','清空本轮演示对话，不影响学习记录','square-pen','new-chat')}`);break;
    case 'new-chat':state.chat=[];state.chatDraft='';state.chatBusy=false;closeSheet(false);render();break;

    case 'memory-delete':state.deletedMemories.push(b.dataset.memory);state.memories=state.memories.filter(x=>x.id!==b.dataset.memory);render(true);toast('已移除这条演示记忆，原始成绩保留。');break;
    case 'analysis-start':startAnalysis();break;case 'analysis-cancel':state.analysis.phase='paused';render(true);remember('暂停分析');break;
    case 'open-usage':go('usage','me');break;case 'open-services':state.serviceReturn=state.route;go('services','me');break;
    case 'calendar-toggle':state.calendarExpanded=!state.calendarExpanded;render(true);break;
    case 'quota-save':{const n=Number(q('[data-input=quota]').value);if(!Number.isInteger(n)||n<0||n>100000){toast('请填写0到100000的整数。');return;}state.quota=n;toast('额度参考已保存在本次演示中。');break;}
    case 'open-backup':go('backup','me');break;
    case 'backup-now':beginBackup();break;case 'backup-manifest':manifest();break;
    case 'sync-now':if(connection.phase!=='connected'){toast('先连接电脑，再同步词库。');return;}state.sync.phase='running';state.sync.at=performance.now()+900;render(true);break;
    case 'settings':go('settings','me');break;case 'preferences':go('preferences','me');break;case 'voices':go('voices','me');break;case 'api':go('api','me');break;
    case 'prefs-save':{const goal=state.memories.find(x=>x.id==='goal');if(goal&&!goal.corrected)goal.text=`日常输入更重视英文拼写，每天学习约${state.prefs.minutes}分钟。`;go('settings','me');toast('演示偏好已保存。');break;}
    case 'test-api':b.disabled=true;q('#qv2-api-status').textContent='正在演示测试进度…';state.apiAt=performance.now()+1000;break;
    case 'about':showSheet('关于这版确认稿','<p class="q-copy" style="margin-top:16px">青简新版UI交互确认稿。仅用于确认页面与操作，不代表这些功能已经加入安装包。</p><p class="q-note">不会读取学习数据库、配对凭据或真实API配置。</p>'+action('知道了','close-sheet','q-primary q-full'));break;

    case 'demo-online':connection.online=true;if(['connecting','reconnecting'].includes(connection.phase)){connection.finishAt=performance.now()+700;connection.nextAt=0;}else toast(connection.phase==='idle'?'网络已恢复，请手动点重新连接。':'演示网络正常。');break;
    case 'demo-timeout':if(['connecting','reconnecting'].includes(connection.phase)){connection.started=performance.now()-60001;tick();}break;
    case 'demo-reset':closeSheet(false);closeScanner();state=initial();connection={phase:'connected',online:true,started:0,finishAt:0,nextAt:0,attempt:0,stopAt:0};render();toast('仅重置了当前确认稿的演示状态。');remember('重置演示');break;
  }}
  root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;if(b.dataset.tab){state.wordBusy=false;state.chatBusy=false;go(b.dataset.tab==='learn'?'home':b.dataset.tab,b.dataset.tab);return;}if(b.dataset.openWord){openWord(b.dataset.openWord);return;}if(b.dataset.date){state.selectedDate=b.dataset.date;const date=new Date(b.dataset.date+'T00:00:00Z');state.year=date.getUTCFullYear();state.month=date.getUTCMonth();render(true);return;}if(b.dataset.action){if(b.dataset.action==='month-prev'||b.dataset.action==='month-next'){const direction=b.dataset.action==='month-prev'?-1:1;if(state.calendarExpanded){const date=new Date(Date.UTC(state.year,state.month+direction,1));state.year=date.getUTCFullYear();state.month=date.getUTCMonth();state.selectedDate=date.toISOString().slice(0,10);}else{const date=new Date(state.selectedDate+'T00:00:00Z');date.setUTCDate(date.getUTCDate()+direction*7);const key=date.toISOString().slice(0,10);state.selectedDate=key>'2026-10-20'?'2026-10-20':key;const selected=new Date(state.selectedDate+'T00:00:00Z');state.year=selected.getUTCFullYear();state.month=selected.getUTCMonth();}render(true);}else runAction(b.dataset.action,b);remember(b.dataset.action);}});
  root.addEventListener('input',event=>{const e=event.target;switch(e.dataset.input){case 'search':state.query=e.value;const list=q('.q-word-items');if(list){list.innerHTML=wordRows();icons();}break;case 'spell':round().answer=e.value.slice(0,80);e.setCustomValidity('');break;case 'exam':{const w=state.exam.questions[state.exam.index];state.exam.answers[w.id]=e.value.slice(0,80);const done=state.exam.questions.filter(w=>(state.exam.answers[w.id]||'').trim()).length;const status=q('#qv2-exam-status');if(status)status.textContent=`已填写 ${done} / ${state.exam.questions.length} 题，交卷前可以修改。`;break;}case 'ai':state.chatDraft=e.value;break;case 'word-ai':state.wordDraft=e.value;break;}});
  root.addEventListener('change',event=>{const e=event.target;if(e.dataset.select){if(e.dataset.select==='exam-count'){state.exam.count=Number(e.value);render(true);}else state.prefs[e.dataset.select]=e.value;}switch(e.dataset.check){case 'auto-memory':state.autoMemory=e.checked;break;case 'analysis-raw':state.analysis.includeRaw=e.checked;break;case 'backup-auto':state.backup.auto=e.checked;break;case 'backup-audio':state.backup.audio=e.checked;state.backup.dirty=true;break;case 'exam-word':state.exam.selected=[...body.querySelectorAll('[data-check=exam-word]:checked')].map(x=>x.value);render(true);break;}remember('修改演示选项');});
  root.addEventListener('submit',event=>{const form=event.target;if(!form.dataset.form)return;event.preventDefault();if(form.dataset.form==='spelling')checkSpelling();else if(form.dataset.form==='ai')askAI(state.chatDraft);else if(form.dataset.form==='word-ai')askAI(state.wordDraft,true);else if(form.dataset.form==='exam'){if(state.exam.index+1<state.exam.questions.length){state.exam.index++;render();}else submitExam();}});

  function tick(){const now=performance.now(),c=connection;if(c.phase==='stopping'&&now>=c.stopAt){c.phase='idle';renderConnection();}if(['connecting','reconnecting'].includes(c.phase)){if(now-c.started>=60000){c.phase='idle';c.finishAt=0;c.nextAt=0;renderConnection();toast('一分钟内未恢复，自动重连已停止。');}else if(c.finishAt&&now>=c.finishAt){c.finishAt=0;if(c.online){c.phase='connected';c.started=0;c.nextAt=0;if(state.backup.phase==='waiting')beginBackup();}else{c.phase='reconnecting';c.nextAt=now+Math.min(1500*2**Math.min(c.attempt-1,4),15000);}renderConnection();}else if(!c.finishAt&&c.nextAt&&now>=c.nextAt){c.attempt++;c.nextAt=0;c.finishAt=now+800;}renderConnection();}
    if(state.chatBusy&&now>=state.chatAt){state.chatBusy=false;state.chat.push({role:'assistant',text:answerText(state.chatQuestion)});state.usage.push({task:'AI答疑（本次演示）',input:920,output:240,cached:0,reasoning:null,turns:1,status:'成功',ms:1000});if(state.route==='ai'){render(true);body.scrollTop=body.scrollHeight;}}
    if(state.wordBusy&&now>=state.wordAt){state.wordBusy=false;const w=currentWord();state.wordChat.push({role:'assistant',text:`${w.id}：${w.cn}。\n${w.usage}\n先遮住英文再试一次，提示后答对与独立答对分别记录。`});state.usage.push({task:'词卡追问（本次演示）',input:780,output:180,cached:0,reasoning:null,turns:1,status:'成功',ms:900});if(state.route==='word')render(true);}
    if(state.analysis.phase==='running'&&now>=state.analysis.at){const a=state.analysis;a.batch++;a.covered=Math.min(a.snapshot,Math.floor(a.snapshot*a.batch/a.total));a.at=now+800;state.usage.push({task:`全量分析·演示第${a.batch}批`,input:1200,output:260,cached:0,reasoning:null,turns:1,status:'成功',ms:800});if(a.batch>=a.total){a.phase='done';a.covered=a.snapshot;updateMemories();}if(state.route==='archive')render(true);}
    if(state.oral.phase==='recording'){const seconds=Math.floor((now-state.oral.at)/1000);const clock=q('#qv2-oral-clock');if(clock)clock.textContent=`${seconds} / 30 秒`;if(seconds>=30)stopOral();}
    if(state.oral.phase==='scoring'&&now>=state.oral.at){state.oral.phase='scored';state.oral.score=86.5;state.assessments.push('成功');record({kind:'oral',word:state.word,score:86.5});if(state.route==='word')render(true);}
    if(state.backup.phase==='running'&&now>=state.backup.at){if(c.phase!=='connected')state.backup.phase='waiting';else{state.backup.phase='idle';state.backup.last='刚刚（演示）';state.backup.dirty=false;state.backup.snapshot={words:words.length,events:state.events.length,usage:state.usage.length,audio:state.backup.audio};}if(state.route==='backup'||state.route==='me')render(true);}
    if(state.sync.phase==='running'&&now>=state.sync.at){state.sync.phase='idle';if(c.phase==='connected'){state.sync.last='刚刚（演示）';toast('示例词库已是最新，重复同步不会重复增加词条。');}if(state.route==='backup')render(true);}
    if(state.apiAt&&now>=state.apiAt){state.apiAt=0;const label=q('#qv2-api-status');if(label){label.textContent='演示：连接测试成功，未访问网络。';q('[data-action=test-api]').disabled=false;}}
    if(state.playing&&now>=state.playUntil){state.playing='';root.querySelectorAll('[data-sound]').forEach(e=>e.setAttribute('aria-pressed','false'));}
    if(!q('.q-toast').hidden&&now>=toastUntil)q('.q-toast').hidden=true;
  }
  const timer=setInterval(()=>{if(!root.isConnected){clearInterval(timer);return;}tick();},100);
  window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent;if(incoming?.version===2&&incoming.tab!==state.tab&&['learn','words','ai','me'].includes(incoming.tab)&&!root.contains(document.activeElement)){state.tab=incoming.tab;state.route=incoming.tab==='learn'?'home':incoming.tab;render();}});
  render();
})();
