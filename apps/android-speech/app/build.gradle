plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'org.qingjian.speech'
    compileSdk 36
    defaultConfig {
        applicationId 'org.qingjian.speech'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName '0.2.22-dev'
        ndk { abiFilters(project.findProperty('speechAbi') ?: 'arm64-v8a') }
        testInstrumentationRunner 'org.qingjian.speech.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    androidResources { noCompress += ['onnx', 'bin'] }
}
dependencies {
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation('ai.koog:agents-core:1.3.0') {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0'
}
